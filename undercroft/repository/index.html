<!DOCTYPE html>
<html lang="en" data-theme="system">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Undercroft Repository</title>
    <script>
      (function () {
        const storageKey = "undercroft.workbench.theme";
        const THEMES = ["light", "system", "dark"];
        const prefersDark = () =>
          typeof window !== "undefined" &&
          window.matchMedia &&
          window.matchMedia("(prefers-color-scheme: dark)").matches;
        const resolveTheme = (preference) => {
          if (preference === "dark") return "dark";
          if (preference === "light") return "light";
          return prefersDark() ? "dark" : "light";
        };
        const apply = (value) => {
          const preference = THEMES.includes(value) ? value : "system";
          const resolved = resolveTheme(preference);
          const root = document.documentElement;
          const body = document.body;
          if (root) {
            root.dataset.themePreference = preference;
            root.dataset.theme = resolved;
            root.dataset.bsTheme = resolved;
            root.style.colorScheme = resolved;
          }
          if (body) {
            body.dataset.themePreference = preference;
            body.dataset.theme = resolved;
            body.dataset.bsTheme = resolved;
            body.style.colorScheme = resolved;
          }
          return preference;
        };
        try {
          const stored = localStorage.getItem(storageKey);
          apply(stored);
        } catch (error) {
          apply("system");
          console.warn("Unable to read theme preference", error);
        }
      })();
    </script>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../common/css/shell.css" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="bg-body text-body" data-undercroft-tool="repository">
    <div class="workbench-app d-flex flex-column">
      <header class="workbench-header border-bottom bg-body-tertiary">
        <div class="workbench-header-grid pe-2 py-3">
          <div class="d-flex align-items-center justify-content-end ps-2" data-repository-settings-slot></div>
          <div class="d-flex align-items-center gap-3 w-100">
            <div class="d-flex align-items-center gap-3">
              <button
                class="btn btn-outline-secondary d-flex align-items-center justify-content-center"
                type="button"
                data-pane-toggle="left"
                aria-label="Toggle page list"
              >
                <span class="iconify fs-5" data-icon="tabler:layout-sidebar-right" aria-hidden="true"></span>
                <span class="visually-hidden">Toggle page list</span>
              </button>
              <h1 class="h5 mb-0 d-flex align-items-center gap-2">
                <nav data-undercroft-tool-nav aria-label="Undercroft tools"></nav>
              </h1>
            </div>
            <div class="ms-auto d-flex align-items-center gap-3 flex-wrap">
              <div data-auth-control class="d-flex">
                <button class="btn btn-outline-secondary" type="button">Login / Register</button>
              </div>
              <div class="btn-group" role="group" aria-label="Theme toggle">
                <button class="btn btn-outline-primary" type="button" data-theme-option="light" aria-label="Use light theme">
                  <span class="iconify fs-5" data-icon="tabler:sun" aria-hidden="true"></span>
                  <span class="visually-hidden">Light theme</span>
                </button>
                <button class="btn btn-outline-primary" type="button" data-theme-option="system">System</button>
                <button class="btn btn-outline-primary" type="button" data-theme-option="dark" aria-label="Use dark theme">
                  <span class="iconify fs-5" data-icon="tabler:moon" aria-hidden="true"></span>
                  <span class="visually-hidden">Dark theme</span>
                </button>
              </div>
              <button
                class="btn btn-outline-secondary d-flex align-items-center justify-content-center"
                type="button"
                data-pane-toggle="right"
                aria-label="Toggle page details"
              >
                <span class="iconify fs-5" data-icon="tabler:adjustments-horizontal" aria-hidden="true"></span>
                <span class="visually-hidden">Toggle page details</span>
              </button>
            </div>
          </div>
          <div></div>
        </div>
      </header>

      <div class="workbench-shell d-flex">
        <aside
          class="border-end border-body-tertiary bg-body-tertiary shadow-theme flex-shrink-0 workbench-sidebar workbench-pane"
          data-pane="left"
          data-pane-collapsed-class="d-none"
          data-pane-expanded-class="d-flex"
          data-pane-initial="expanded"
        >
          <div class="workbench-pane-content d-flex flex-column gap-3 p-3 workbench-sticky-pane">
            <section class="d-flex flex-column gap-3">
              <div class="btn-toolbar justify-content-center" role="toolbar" aria-label="Repository actions">
                <div class="btn-group" role="group">
                  <button
                    class="btn btn-outline-secondary p-2"
                    type="button"
                    data-action="undo-page"
                    data-bs-toggle="tooltip"
                    data-bs-placement="bottom"
                    data-bs-title="Undo"
                    aria-label="Undo"
                  >
                    <span class="iconify fs-5" data-icon="tabler:arrow-back-up" aria-hidden="true"></span>
                    <span class="visually-hidden">Undo</span>
                  </button>
                  <button
                    class="btn btn-outline-secondary p-2"
                    type="button"
                    data-action="redo-page"
                    data-bs-toggle="tooltip"
                    data-bs-placement="bottom"
                    data-bs-title="Redo"
                    aria-label="Redo"
                  >
                    <span class="iconify fs-5" data-icon="tabler:arrow-forward-up" aria-hidden="true"></span>
                    <span class="visually-hidden">Redo</span>
                  </button>
                  <button
                    class="btn btn-outline-primary p-2"
                    type="button"
                    data-action="new-page"
                    data-bs-toggle="tooltip"
                    data-bs-placement="bottom"
                    data-bs-title="New Page"
                    aria-label="New Page"
                  >
                    <span class="iconify fs-5" data-icon="tabler:file-plus" aria-hidden="true"></span>
                    <span class="visually-hidden">New Page</span>
                  </button>
                  <button
                    class="btn btn-outline-secondary p-2"
                    type="button"
                    data-action="duplicate-page"
                    disabled
                    data-bs-toggle="tooltip"
                    data-bs-placement="bottom"
                    data-bs-title="Duplicate Page"
                    aria-label="Duplicate Page"
                  >
                    <span class="iconify fs-5" data-icon="tabler:copy" aria-hidden="true"></span>
                    <span class="visually-hidden">Duplicate Page</span>
                  </button>
                  <button
                    class="btn btn-outline-success p-2"
                    type="button"
                    data-action="save-page"
                    disabled
                    data-bs-toggle="tooltip"
                    data-bs-placement="bottom"
                    data-bs-title="Save Page"
                    aria-label="Save Page"
                  >
                    <span class="iconify fs-5" data-icon="tabler:device-floppy" aria-hidden="true"></span>
                    <span class="visually-hidden">Save Page</span>
                  </button>
                  <button
                    class="btn btn-outline-danger p-2"
                    type="button"
                    data-action="delete-page"
                    disabled
                    data-bs-toggle="tooltip"
                    data-bs-placement="bottom"
                    data-bs-title="Delete Page"
                    aria-label="Delete Page"
                  >
                    <span class="iconify fs-5" data-icon="tabler:trash" aria-hidden="true"></span>
                    <span class="visually-hidden">Delete Page</span>
                  </button>
                  <button
                    class="btn btn-outline-secondary p-2"
                    type="button"
                    data-action="toggle-mode"
                    disabled
                    data-bs-toggle="tooltip"
                    data-bs-placement="bottom"
                    data-bs-title="View"
                  >
                    <span data-repository-mode-icon="view">
                      <span class="iconify fs-5" data-icon="tabler:eye" aria-hidden="true"></span>
                    </span>
                    <span class="d-none" data-repository-mode-icon="edit">
                      <span class="iconify fs-5" data-icon="tabler:pencil" aria-hidden="true"></span>
                    </span>
                    <span class="visually-hidden" data-repository-mode-label>View</span>
                  </button>
                </div>
              </div>
            </section>
            <div class="d-flex gap-2">
              <input
                class="form-control form-control-sm"
                type="search"
                placeholder="Search pages…"
                aria-label="Search pages"
                data-repository-search
              />
            </div>
            <div class="d-flex flex-column gap-1" data-repository-page-tree></div>
          </div>
        </aside>

        <main class="workbench-main flex-grow-1 p-3 overflow-auto">
          <div class="card shadow-theme" data-repository-editor-empty>
            <div class="card-body text-center text-body-secondary py-5">
              Select a page from the list, or create a new one.
            </div>
          </div>
          <div class="d-none card shadow-theme h-100" data-repository-editor style="min-height: 0;">
            <div class="card-body d-flex flex-column gap-3" style="min-height: 0; overflow: hidden;">
              <input
                class="form-control form-control-lg border-0 bg-transparent px-0 flex-shrink-0"
                type="text"
                placeholder="Untitled page"
                aria-label="Page title"
                data-repository-title
              />
              <textarea
                class="form-control font-monospace"
                style="flex: 1 1 0; min-height: 0; resize: none"
                placeholder="Write in Markdown…"
                data-repository-body
              ></textarea>
              <div class="d-none border rounded-3 bg-body p-3 repository-preview" style="flex: 1 1 0; min-height: 0; overflow-y: auto" data-repository-preview></div>
            </div>
          </div>
        </main>

        <aside
          class="d-none flex-column gap-3 border-start border-body-tertiary bg-body-tertiary shadow-theme flex-shrink-0 workbench-sidebar workbench-pane"
          data-pane="right"
          data-pane-collapsed-class="d-none"
          data-pane-expanded-class="d-flex"
          data-pane-initial="expanded"
        >
          <div class="workbench-pane-content d-flex flex-column gap-4 p-3 workbench-sticky-pane">
            <section class="d-flex flex-column gap-3">
              <div class="d-flex align-items-center justify-content-between">
                <h2 class="h6 text-uppercase fw-semibold text-body-secondary mb-0">Outline</h2>
                <button
                  class="btn btn-outline-secondary btn-sm d-inline-flex align-items-center justify-content-center collapsible-toggle"
                  type="button"
                  data-repository-outline-toggle
                  aria-expanded="true"
                >
                  <span class="iconify" data-icon="tabler:chevron-down" aria-hidden="true"></span>
                  <span class="visually-hidden" data-repository-outline-toggle-label>Collapse outline</span>
                </button>
              </div>
              <div class="d-flex flex-column gap-1" data-repository-outline-panel>
                <div data-repository-outline-list></div>
              </div>
            </section>
            <section class="d-flex flex-column gap-3">
              <div class="d-flex align-items-center justify-content-between">
                <div class="d-flex align-items-center gap-2">
                  <h2 class="h6 text-uppercase fw-semibold text-body-secondary mb-0">Tags</h2>
                  <span class="align-middle" data-help-topic="repository.tags" data-help-insert="replace"></span>
                </div>
                <button
                  class="btn btn-outline-secondary btn-sm d-inline-flex align-items-center justify-content-center collapsible-toggle"
                  type="button"
                  data-repository-tags-toggle
                  aria-expanded="true"
                >
                  <span class="iconify" data-icon="tabler:chevron-down" aria-hidden="true"></span>
                  <span class="visually-hidden" data-repository-tags-toggle-label>Collapse tags</span>
                </button>
              </div>
              <div class="d-flex flex-column gap-2" data-repository-tags-panel>
                <div data-repository-tags-badges></div>
                <div data-repository-tags-input></div>
              </div>
            </section>
            <section class="d-flex flex-column gap-3" data-repository-parent-section>
              <div class="d-flex align-items-center justify-content-between">
                <div class="d-flex align-items-center gap-2">
                  <h2 class="h6 text-uppercase fw-semibold text-body-secondary mb-0">Parent</h2>
                  <span class="align-middle" data-help-topic="repository.parent" data-help-insert="replace"></span>
                </div>
                <button
                  class="btn btn-outline-secondary btn-sm d-inline-flex align-items-center justify-content-center collapsible-toggle"
                  type="button"
                  data-repository-parent-toggle
                  aria-expanded="true"
                >
                  <span class="iconify" data-icon="tabler:chevron-down" aria-hidden="true"></span>
                  <span class="visually-hidden" data-repository-parent-toggle-label>Collapse parent</span>
                </button>
              </div>
              <div data-repository-parent-panel>
                <div data-repository-parent-content></div>
              </div>
            </section>
            <section class="d-flex flex-column gap-3" data-repository-related-section>
              <div class="d-flex align-items-center justify-content-between">
                <h2 class="h6 text-uppercase fw-semibold text-body-secondary mb-0">Related</h2>
                <button
                  class="btn btn-outline-secondary btn-sm d-inline-flex align-items-center justify-content-center collapsible-toggle"
                  type="button"
                  data-repository-related-toggle
                  aria-expanded="true"
                >
                  <span class="iconify" data-icon="tabler:chevron-down" aria-hidden="true"></span>
                  <span class="visually-hidden" data-repository-related-toggle-label>Collapse related</span>
                </button>
              </div>
              <div data-repository-related-panel>
                <div data-repository-related-list></div>
              </div>
            </section>
            <section class="d-flex flex-column gap-3" data-repository-backlinks-section>
              <div class="d-flex align-items-center justify-content-between">
                <h2 class="h6 text-uppercase fw-semibold text-body-secondary mb-0">Backlinks</h2>
                <button
                  class="btn btn-outline-secondary btn-sm d-inline-flex align-items-center justify-content-center collapsible-toggle"
                  type="button"
                  data-repository-backlinks-toggle
                  aria-expanded="true"
                >
                  <span class="iconify" data-icon="tabler:chevron-down" aria-hidden="true"></span>
                  <span class="visually-hidden" data-repository-backlinks-toggle-label>Collapse backlinks</span>
                </button>
              </div>
              <div data-repository-backlinks-panel>
                <div data-repository-backlinks-list></div>
              </div>
            </section>
          </div>
        </aside>
      </div>
    </div>

    <div class="status-root" data-status-root></div>

    <script type="module" src="js/app.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/@iconify/iconify@3.1.1/dist/iconify.min.js"></script>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script defer src="https://cdn.jsdelivr.net/npm/marked@18.0.7/lib/marked.umd.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/dompurify@3.4.12/dist/purify.min.js"></script>
  </body>
</html>
