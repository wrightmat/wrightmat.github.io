<!DOCTYPE html>
<html lang="en" data-theme="system">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Undercroft Sanctum</title>
    <script src="../common/js/theme-init.js"></script>
    <link rel="stylesheet" href="../common/css/shell.css" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="bg-body text-body" data-undercroft-tool="sanctum">
    <div class="d-flex flex-column min-vh-100 workbench-app">
      <div data-app-shell-header></div>

      <div class="d-flex flex-grow-1 workbench-shell">
        <div data-pane-content="left">
          <div class="btn-toolbar justify-content-center" role="toolbar" aria-label="Location actions">
            <div class="btn-group" role="group" data-location-toolbar-mount></div>
            <div class="btn-group ms-2" role="group" data-location-undo-toolbar-mount></div>
          </div>

          <div data-selections-mount></div>
          <div class="d-flex flex-column gap-2" data-selections-panel>
            <div data-field-mount="system-select"></div>
            <div data-field-mount="setting-select"></div>
            <div data-field-mount="location-select"></div>

            <div class="d-flex flex-column gap-2" id="sanctum-overrides" data-generation-fields>
              <div data-field-mount="type-override"></div>
              <div data-field-mount="purpose-override"></div>
              <div data-field-mount="environment-override"></div>
              <div data-field-mount="locked-features"></div>
            </div>
          </div>

          <div class="mt-auto" id="sanctum-json" data-json-mount></div>
        </div>

        <main class="workbench-main flex-grow-1 p-3 overflow-auto">
          <!-- The suite-wide Mode header — the "Nothing selected yet"
               empty-state message (condensed, left-aligned, no card — see
               js/app.js's own createEmptyStateCard "inline" variant call)
               flush on the left, ms-auto pushing Mode (Location/Relationships,
               a real labeled button group) to the right regardless of
               whether the empty-state message is present. Same
               createModeToggleGroup pattern Repository/Forge/Crucible's own
               header uses — see js/app.js's own renderModeToggle.
               Relationships mode always shows graph+list together now — no
               separate View toggle. The whole-Setting Location Graph
               overview that used to sit here as its own always-visible card
               is gone — it's reachable the same way every other tool's
               Relationships graph is now: switch to Relationships mode
               above. -->
          <div class="d-flex align-items-center gap-2 mb-3" data-sanctum-header>
            <div data-location-empty-state></div>
            <div class="d-flex align-items-center gap-2 ms-auto">
              <div data-sanctum-mode-toggle-mount></div>
            </div>
          </div>

          <div class="d-flex flex-column gap-3 d-none" data-location-display>
            <div class="card shadow-theme">
              <div class="card-body">
                <div data-identity-mount></div>
                <div class="d-flex flex-column gap-2" data-identity-panel>
                  <div data-field-mount="location-name"></div>
                  <div class="row g-3" data-identity-fields></div>
                </div>
              </div>
            </div>

            <div class="card shadow-theme">
              <div class="card-body">
                <div data-features-mount></div>
                <div class="d-flex flex-column gap-2" data-features-panel>
                    <div class="d-flex flex-column gap-2" data-feature-list></div>
                    <div class="d-flex gap-2 align-items-center">
                      <select class="form-select" data-add-feature-select></select>
                      <button class="btn btn-outline-secondary flex-shrink-0 d-flex align-items-center gap-1" type="button" data-add-feature-button>
                        <span class="iconify" data-icon="tabler:plus" aria-hidden="true"></span>
                        Add
                      </button>
                    </div>
                  </div>
              </div>
            </div>

            <div class="card shadow-theme">
              <div class="card-body">
                <div data-assets-needs-mount></div>
                  <div class="d-flex flex-column gap-2" data-assets-needs-panel>
                    <div class="d-flex align-items-center gap-2 d-none" data-shop-controls>
                      <span class="small text-body-secondary flex-grow-1" data-shop-status>Shop closed.</span>
                      <button class="btn btn-outline-primary btn-sm" type="button" data-open-shop-button>Open Shop</button>
                      <button class="btn btn-outline-secondary btn-sm d-none" type="button" data-close-shop-button>Close Shop</button>
                    </div>
                    <h3 class="fs-6 fw-semibold text-body-secondary mb-0">Assets</h3>
                    <div class="d-flex flex-column gap-2" data-asset-list></div>
                    <div class="d-flex gap-2 align-items-center">
                      <select class="form-select flex-shrink-0" style="max-width: 8rem" data-add-asset-kind-select></select>
                      <select class="form-select" data-add-asset-entity-select></select>
                      <button class="btn btn-outline-secondary flex-shrink-0 d-flex align-items-center gap-1" type="button" data-add-asset-button>
                        <span class="iconify" data-icon="tabler:plus" aria-hidden="true"></span>
                        Add
                      </button>
                    </div>

                    <h3 class="fs-6 fw-semibold text-body-secondary mb-0 mt-3">Needs</h3>
                    <div class="d-flex flex-column gap-2" data-need-list></div>
                    <div class="d-flex gap-2 align-items-center">
                      <select class="form-select flex-shrink-0" style="max-width: 8rem" data-add-need-kind-select></select>
                      <select class="form-select" data-add-need-entity-select></select>
                      <button class="btn btn-outline-secondary flex-shrink-0 d-flex align-items-center gap-1" type="button" data-add-need-button>
                        <span class="iconify" data-icon="tabler:plus" aria-hidden="true"></span>
                        Add
                      </button>
                    </div>
                  </div>
              </div>
            </div>

            <div class="card shadow-theme">
              <div class="card-body">
                <div data-npc-config-mount></div>
                  <div class="d-flex flex-column gap-3" data-npc-config-panel hidden>
                    <section class="d-flex flex-column gap-2" id="sanctum-species-weights">
                      <div class="d-flex align-items-center justify-content-between gap-2">
                        <h3 class="fs-6 fw-semibold text-body-secondary mb-0">Species Weights</h3>
                        <div class="d-flex align-items-center gap-2">
                          <span class="small text-body-secondary" data-species-weight-total>Total: 0</span>
                          <button class="btn btn-outline-secondary btn-sm p-1" type="button" data-add-species-weight aria-label="Add Species">
                            <span class="iconify" data-icon="tabler:plus" aria-hidden="true"></span>
                          </button>
                        </div>
                      </div>
                      <div class="d-flex flex-column gap-2 border rounded-3 p-2 overflow-auto" style="max-height: 16rem" data-species-weight-rows></div>
                      </section>

                    <section class="d-flex flex-column gap-2" id="sanctum-mixing-coefficient">
                      <h3 class="fs-6 fw-semibold text-body-secondary mb-0">Mixing Coefficient</h3>
                      <div class="d-flex align-items-center gap-2">
                        <input class="form-range" type="range" min="0" max="1" step="0.05" data-mixing-coefficient />
                        <span class="small text-body-secondary" style="min-width: 3rem" data-mixing-coefficient-value>0.00</span>
                      </div>
                    </section>

                    <section class="d-flex flex-column gap-2" id="sanctum-archetype-overrides">
                      <div class="d-flex align-items-center justify-content-between gap-2">
                        <h3 class="fs-6 fw-semibold text-body-secondary mb-0">Setting-Specific Archetypes</h3>
                        <button class="btn btn-outline-secondary btn-sm p-1" type="button" data-add-archetype-override aria-label="Add Override">
                          <span class="iconify" data-icon="tabler:plus" aria-hidden="true"></span>
                        </button>
                      </div>
                      <div class="d-flex flex-column gap-2" data-archetype-override-rows></div>
                    </section>

                    <section class="d-flex flex-column gap-2" id="sanctum-generic-name-fallback">
                      <div class="d-flex align-items-center justify-content-between gap-2">
                        <h3 class="fs-6 fw-semibold text-body-secondary mb-0">Generic Name Fallback</h3>
                        <button class="btn btn-outline-secondary btn-sm p-1" type="button" data-add-fallback-name aria-label="Add Name">
                          <span class="iconify" data-icon="tabler:plus" aria-hidden="true"></span>
                        </button>
                      </div>
                      <div class="d-flex flex-column gap-2 border rounded-3 p-2 overflow-auto" style="max-height: 16rem" data-fallback-name-rows></div>
                    </section>
                  </div>
              </div>
            </div>

            <div class="card shadow-theme">
              <div class="card-body">
                <section class="d-flex flex-column gap-2" id="sanctum-notes">
                  <div class="d-flex align-items-center justify-content-between gap-2 flex-wrap">
                    <h2 class="h6 text-uppercase fw-semibold text-body-secondary mb-0 d-flex align-items-center gap-2">
                      <span>Notes (optional)</span>
                      <span class="align-middle" data-help-topic="sanctum.notes" data-help-insert="replace"></span>
                    </h2>
                    <div class="d-flex align-items-center gap-2">
                      <button
                        class="btn btn-outline-secondary btn-sm"
                        type="button"
                        data-notes-mode-toggle
                        data-bs-toggle="tooltip"
                        data-bs-title="Edit"
                      >
                        <span class="iconify d-none" data-icon="tabler:eye" aria-hidden="true" data-notes-mode-icon="view"></span>
                        <span class="iconify" data-icon="tabler:pencil" aria-hidden="true" data-notes-mode-icon="edit"></span>
                        <span data-notes-mode-label>Edit</span>
                      </button>
                      <button class="btn btn-outline-secondary btn-sm" type="button" data-generate-note>
                        <span class="iconify" data-icon="tabler:sparkles" aria-hidden="true"></span>
                        Generate Note
                      </button>
                      <span data-notes-toggle-mount></span>
                    </div>
                  </div>
                  <div class="d-flex flex-column gap-2" data-notes-panel>
                    <textarea class="form-control d-none" rows="3" data-notes-text placeholder="Type a note, or Generate Note to have Claude write one."></textarea>
                    <div data-notes-preview></div>
                  </div>
                </section>
              </div>
            </div>
          </div>

          <!-- Relationships — a second, mutually-exclusive Mode (not a card
               inside Location mode anymore) — see js/app.js's own setMode.
               Same shared relationship-editor.js/relationship-graph.js pair
               every other kind uses (Forge/Crucible/Workbench) — no
               Sanctum-specific Parent/Connected-To/Children UI anymore.
               "Parent of" and "Connected to" are just two of this tool's own
               suggested types (js/app.js's own RELATIONSHIP_TYPE_SUGGESTIONS);
               Children falls out of the same mechanism that makes Forge's
               Factions work — an incoming "Parent of" edge from another
               Location shows up in THIS list automatically, no separate
               "children" concept or query needed. -->
          <div class="d-none card shadow-theme" data-location-relationships>
            <div class="card-body d-flex flex-column gap-2">
              <div data-relationships-graph-wrap>
                <div class="relationship-graph-stage" data-relationships-graph-container>
                  <div class="relationship-graph-content" data-relationships-graph-content>
                    <svg data-relationships-graph-svg viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid meet"></svg>
                  </div>
                  <div class="relationship-graph-controls d-flex align-items-center gap-2" data-relationships-graph-controls>
                    <div class="btn-group btn-group-sm" role="group" aria-label="Relationships zoom controls" data-relationships-graph-toolbar-mount></div>
                  </div>
                </div>
                <div class="d-none" data-relationships-graph-empty></div>
              </div>
              <div data-relationships-list-mount></div>
            </div>
          </div>
        </main>

        <div data-pane-content="right">
            <div data-setting-mount></div>
              <div class="d-flex flex-column gap-3" data-setting-panel>
                <div class="btn-toolbar justify-content-center" role="toolbar" aria-label="Setting actions">
                  <div class="btn-group" role="group" data-setting-toolbar-mount></div>
                </div>
                <div class="d-flex flex-column gap-3">
                  <div data-field-mount="setting-name"></div>
                  <div data-field-mount="setting-description"></div>
                </div>

                <div data-setting-species-mount></div>
                  <div class="d-flex flex-column gap-2" data-setting-species-panel hidden>
                    <div class="d-flex align-items-center justify-content-end gap-2">
                      <span class="small text-body-secondary" data-setting-species-weight-total>Total: 0</span>
                      <button class="btn btn-outline-secondary btn-sm p-1" type="button" data-add-setting-species-weight aria-label="Add Species">
                        <span class="iconify" data-icon="tabler:plus" aria-hidden="true"></span>
                      </button>
                    </div>
                    <div class="d-flex flex-column gap-2 border rounded-3 p-2 overflow-auto" style="max-height: 16rem" data-setting-species-weight-rows></div>
                  </div>

                <div data-calendar-mount></div>
                  <div class="d-flex flex-column gap-3" data-calendar-panel hidden>
                    <div class="row g-2">
                      <div class="col-6" data-field-mount="calendar-days-per-week"></div>
                      <div class="col-6" data-field-mount="calendar-epoch-label"></div>
                      <div class="col-6" data-field-mount="calendar-starting-year"></div>
                    </div>

                    <section class="d-flex flex-column gap-2">
                      <div class="d-flex align-items-center justify-content-between gap-2">
                        <h4 class="fs-6 fw-semibold text-body-secondary mb-0">Weekday Names</h4>
                        <button class="btn btn-outline-secondary btn-sm p-1" type="button" data-add-weekday-name aria-label="Add weekday">
                          <span class="iconify" data-icon="tabler:plus" aria-hidden="true"></span>
                        </button>
                      </div>
                      <div class="d-flex flex-column gap-2" data-weekday-name-rows></div>
                    </section>

                    <section class="d-flex flex-column gap-2">
                      <div class="d-flex align-items-center justify-content-between gap-2">
                        <h4 class="fs-6 fw-semibold text-body-secondary mb-0">Months</h4>
                        <button class="btn btn-outline-secondary btn-sm p-1" type="button" data-add-month aria-label="Add month">
                          <span class="iconify" data-icon="tabler:plus" aria-hidden="true"></span>
                        </button>
                      </div>
                      <div class="d-flex flex-column gap-2" data-month-rows></div>
                    </section>

                    <section class="d-flex flex-column gap-2">
                      <div class="d-flex align-items-center justify-content-between gap-2">
                        <h4 class="fs-6 fw-semibold text-body-secondary mb-0">Moon Cycles</h4>
                        <button class="btn btn-outline-secondary btn-sm p-1" type="button" data-add-moon-cycle aria-label="Add moon">
                          <span class="iconify" data-icon="tabler:plus" aria-hidden="true"></span>
                        </button>
                      </div>
                      <div class="d-flex flex-column gap-2" data-moon-cycle-rows></div>
                    </section>
                  </div>
              </div>

            <div data-inspector-mount></div>
            <div class="d-flex flex-column gap-3" data-inspector-panel>
              <div data-inspector-empty class="border border-dashed rounded-3 p-3 text-center text-body-secondary small">
                Select a Feature, Asset, or Need to see its full detail here.
              </div>
              <div data-inspector-detail class="d-none">
                <pre class="border rounded-3 p-2 bg-body small mb-0" data-inspector-json></pre>
              </div>
            </div>
        </div>
      </div>
    </div>

    <div class="status-root" data-status-root></div>

    <!-- Module script placed before the deferred CDN scripts on purpose —
         both execute in shared document order after parsing, so this
         ordering keeps the page's own JS from waiting on the CDN scripts
         to finish loading before it can run. See undercroft/index.html for
         the full explanation. -->
    <script type="module" src="js/app.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/@iconify/iconify@3.1.1/dist/iconify.min.js"></script>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <!-- Repository's own renderMarkdown-shaped rendering (library-reference.js's
         own renderNotesPreview, for reference-chip hover previews) checks for
         window.marked/window.DOMPurify at call time, not module load, so
         loading these `defer`red like every other CDN script here is safe. -->
    <script defer src="https://cdn.jsdelivr.net/npm/marked@18.0.7/lib/marked.umd.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/dompurify@3.4.12/dist/purify.min.js"></script>
  </body>
</html>
