<!DOCTYPE html>
<html lang="en" data-theme="system">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Undercroft</title>
    <script src="common/js/theme-init.js"></script>
    <!-- Same Leaflet build Orrery itself loads (orrery/index.html) — the Map
         widget's tile-type viewer (common/js/lib/widgets/map.js) reuses
         Orrery's own BaseMapManager, which reads window.L directly. -->
    <link rel="stylesheet" href="common/vendor/leaflet/leaflet.css" />
    <link rel="stylesheet" href="common/css/shell.css" />
    <!-- Marker/Icon-field glyph fonts (common/js/lib/icon-picker.js's own
         getIconTokens only ever returns "bi-*"/"ddb-*" tokens — Iconify's
         own runtime script below never covers those, only "tabler:*").
         Confirmed real bug this fixes: a Marker layer's own icon (Orrery's
         own map-viewer.js createMarkerDot) rendered fine in Orrery itself
         (orrery/index.html loads both of these) but silently rendered as
         nothing at all in the Dashboard's Map widget — same shared
         rendering code, this page just never loaded the fonts it depends
         on. Also covers any Press-rendered Handout content using an Icon
         component field, for the same reason. -->
    <link rel="stylesheet" href="common/vendor/bootstrap-icons/bootstrap-icons.css" />
    <link rel="stylesheet" href="common/css/ddb-icons.css" />
    <!-- Styles the .orrery-map-stage/-content/-image and
         .orrery-layer-*-overlay classes BaseMapManager builds internally —
         NOT the page-level .orrery-map class itself (position: fixed;
         inset: 0, meant for Orrery's own full-viewport host), which the Map
         widget deliberately never applies (see map.js's own comment). -->
    <link rel="stylesheet" href="orrery/css/styles.css" />
    <!-- Styles a rendered Press template's own markup (.print-page,
         .card-grid/.card-tile, .chip-grid/.chip-tile, ...) — the Handout
         widget (common/js/lib/widgets/handout.js) renders a real template
         via press/js/templates.js's template.createPage, the same function
         Workbench's own "Now Showing" panel uses (workbench/index.html
         loads this same stylesheet for that exact reason). -->
    <link rel="stylesheet" href="press/css/styles.css" />
  </head>
  <body class="bg-body text-body" data-undercroft-tool="home">
    <div class="d-flex flex-column min-vh-100" data-dashboard-shell>
      <div data-app-shell-header></div>
      <div class="d-flex flex-grow-1 overflow-hidden">
        <div data-pane-content="left">
          <div class="d-flex flex-column gap-3" style="min-height: 0;">
            <div>
              <h2 class="text-uppercase fs-6 fw-semibold text-body-secondary mb-1">Favorite Documentation</h2>
              <a class="small" href="common/docs.html" target="_blank" rel="noopener noreferrer">
                Open the full documentation page &#8599;
              </a>
            </div>
            <div class="d-flex flex-column gap-1 overflow-auto flex-grow-1 pane-scroll" style="min-height: 0;" data-doc-favorites>
              <p class="text-body-secondary small mb-0">Loading…</p>
            </div>
          </div>
        </div>
        <main class="workbench-main flex-grow-1 p-3 overflow-auto d-flex flex-column gap-4" data-dashboard-main>
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
              <h2 class="h4 mb-0 d-flex align-items-center gap-2 flex-grow-1" style="min-width: 0;">
                <span data-dashboard-title-display>Home</span>
                <input
                  class="dashboard-title-input d-none flex-grow-1"
                  style="min-width: 0;"
                  type="text"
                  aria-label="Dashboard title"
                  data-dashboard-title-input
                />
                <span class="align-middle" data-help-topic="dashboard.basics" data-help-insert="replace"></span>
              </h2>
              <div class="d-flex align-items-center gap-2 flex-wrap">
                <div
                  class="btn-toolbar align-items-center gap-2 d-none"
                  role="toolbar"
                  aria-label="Dashboard layout tools"
                  data-dashboard-layout-tools
                >
                  <div class="btn-group" role="group" aria-label="Add a widget" data-dashboard-add-toolbar></div>
                </div>
                <span data-dashboard-screen-toggle-mount></span>
                <button class="btn btn-dark py-2 px-3 d-none d-md-inline-block" type="button" data-dashboard-edit-toggle>
                  Edit layout
                </button>
              </div>
            </div>
            <div class="dashboard-grid" data-dashboard-grid></div>
            <!-- Shown instead of the grid above for a not-signed-in visitor
                 with nothing set up yet (dashboard.js's own
                 shouldShowWelcomeScreen/renderWelcomeScreen) — a plain
                 sibling, not something built INSIDE .dashboard-grid, so its
                 content is never constrained by that element's own CSS Grid
                 row-track sizing (grid-auto-rows: 6rem, meant for widget
                 cards, far too short for a welcome message). -->
            <div class="d-none flex-column gap-4" data-dashboard-welcome></div>
        </main>
        <div data-pane-content="right">
          <div class="d-flex flex-column gap-3 overflow-auto pane-scroll" data-widget-inspector>
            <h2 class="text-uppercase fs-6 fw-semibold text-body-secondary mb-0">Widget Inspector</h2>
            <p class="small text-body-secondary mb-0" data-widget-inspector-empty>
              Select a widget from your layout to inspect it here.
            </p>
            <div class="d-flex flex-column gap-3 d-none" data-widget-inspector-details>
              <div class="btn-toolbar justify-content-center overflow-x-auto" role="toolbar" aria-label="Widget actions">
                <div class="btn-group" role="group" aria-label="Widget actions" data-widget-inspector-toolbar-mount></div>
              </div>
              <div class="d-flex align-items-center gap-2">
                <span class="badge text-bg-secondary" data-widget-inspector-type></span>
                <span class="align-middle" data-widget-inspector-help data-help-insert="replace"></span>
              </div>
              <div class="d-flex flex-column gap-2" data-widget-inspector-body></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- Shown instead of everything above (data-dashboard-shell) when the URL
         carries ?screen=1 — a live, read-only mirror of whatever's currently
         shown to the table, laid out exactly like the GM's own Edit layout
         grid, for a physical second screen/TV. See dashboard.js's own
         renderScreenView. -->
    <div class="d-none flex-column vh-100 p-3" data-dashboard-screen-root></div>
    <div class="status-root" data-status-root></div>
    <!--
      The module script is placed BEFORE these classic deferred scripts on
      purpose. Both module scripts and `defer` scripts execute after parsing,
      in shared document order — so if this module tag came after them (as
      it originally did), its execution would wait for Iconify/Bootstrap/
      SortableJS to finish loading over the CDN before running at all, even
      though `defer` already made their *fetching* non-blocking. Confirmed
      directly (not just reasoned): with the old order, this page's own
      module code only started running once window.bootstrap/Iconify/
      Sortable were already defined; with this order, it runs before any of
      them exist. app-shell.js already treats window.bootstrap as optional
      (checks before using it), so nothing here actually needs the CDN
      scripts to have run first — the nav panel, panes, and theme controls
      don't touch any of them.
    -->
    <script defer src="https://cdn.jsdelivr.net/npm/@iconify/iconify@3.1.1/dist/iconify.min.js" integrity="sha384-Ok2uDHnWhbSMsjjXrs20mYHBe3BLztRYQuPMBhyLnjPNH7OqWdv/c8Bmv54yhfKR" crossorigin="anonymous"></script>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script defer src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js" integrity="sha384-eeLEhtwdMwD3X9y+8P3Cn7Idl/M+w8H4uZqkgD/2eJVkWIN1yKzEj6XegJ9dL3q0" crossorigin="anonymous"></script>
    <script
      defer
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <!-- Repository's own markdown renderer (common/js/lib/widgets/handout.js's
         renderJournalEntry) runs here too, for a journal Handout widget — same
         pinned versions as repository/index.html's own script tags. -->
    <script defer src="https://cdn.jsdelivr.net/npm/marked@18.0.7/lib/marked.umd.min.js" integrity="sha384-fLcv0/sXzwqIpE+6a2K1pEC+pwVu+cXnn/f4xW4/1Pfea5RBO2PV57uEnG2KwuCF" crossorigin="anonymous"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/dompurify@3.4.12/dist/purify.min.js" integrity="sha384-piCcpDdJ7qVeK4Tv8Z6Hpcr3ZBIgP16TxQTPVfsLFdZ5uDgwc3Y8Ho7oUnqf12qu" crossorigin="anonymous"></script>
    <script type="module" src="dashboard.js"></script>
  </body>
</html>
