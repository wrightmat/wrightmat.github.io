<!DOCTYPE html>
<html lang="en" data-theme="system">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Undercroft</title>
    <script>
      (function () {
        const storageKey = "undercroft.workbench.theme";
        const THEMES = ["light", "system", "dark"];
        const prefersDark = () =>
          typeof window !== "undefined" &&
          window.matchMedia &&
          window.matchMedia("(prefers-color-scheme: dark)").matches;
        const resolveTheme = (preference) => {
          if (preference === "dark") return "dark";
          if (preference === "light") return "light";
          return prefersDark() ? "dark" : "light";
        };
        const apply = (value) => {
          const preference = THEMES.includes(value) ? value : "system";
          const resolved = resolveTheme(preference);
          const root = document.documentElement;
          const body = document.body;
          if (root) {
            root.dataset.themePreference = preference;
            root.dataset.theme = resolved;
            root.dataset.bsTheme = resolved;
            root.style.colorScheme = resolved;
          }
          if (body) {
            body.dataset.themePreference = preference;
            body.dataset.theme = resolved;
            body.dataset.bsTheme = resolved;
            body.style.colorScheme = resolved;
          }
          return preference;
        };
        try {
          const stored = localStorage.getItem(storageKey);
          apply(stored);
        } catch (error) {
          apply("system");
          console.warn("Unable to read theme preference", error);
        }
      })();
    </script>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="common/css/shell.css" />
  </head>
  <body class="bg-body text-body" data-undercroft-tool="home">
    <div class="d-flex flex-column min-vh-100">
      <header class="workbench-header border-bottom bg-body-tertiary">
        <div class="workbench-header-grid pe-2 py-3">
          <div></div>
          <div class="d-flex align-items-center gap-3 w-100">
            <div class="d-flex align-items-center gap-3">
              <button
                class="btn btn-outline-secondary d-flex align-items-center justify-content-center"
                type="button"
                data-pane-toggle="left"
                aria-label="Toggle navigation pane"
              >
                <span class="iconify fs-5" data-icon="tabler:layout-sidebar-right" aria-hidden="true"></span>
                <span class="visually-hidden">Toggle navigation pane</span>
              </button>
              <h1 class="h5 mb-0 d-flex align-items-center gap-2">
                <nav data-undercroft-tool-nav aria-label="Undercroft tools"></nav>
              </h1>
            </div>
            <div class="ms-auto d-flex align-items-center gap-3 flex-wrap">
              <div data-auth-control class="d-flex">
                <button class="btn btn-outline-secondary" type="button">Login / Register</button>
              </div>
              <div class="btn-group" role="group" aria-label="Theme toggle">
                <button class="btn btn-outline-primary" type="button" data-theme-option="light" aria-label="Use light theme">
                  <span class="iconify fs-5" data-icon="tabler:sun" aria-hidden="true"></span>
                  <span class="visually-hidden">Light theme</span>
                </button>
                <button class="btn btn-outline-primary" type="button" data-theme-option="system">System</button>
                <button class="btn btn-outline-primary" type="button" data-theme-option="dark" aria-label="Use dark theme">
                  <span class="iconify fs-5" data-icon="tabler:moon" aria-hidden="true"></span>
                  <span class="visually-hidden">Dark theme</span>
                </button>
              </div>
              <button
                class="btn btn-outline-secondary d-flex align-items-center justify-content-center"
                type="button"
                data-pane-toggle="right"
                aria-label="Toggle details pane"
              >
                <span class="iconify fs-5" data-icon="tabler:adjustments-horizontal" aria-hidden="true"></span>
                <span class="visually-hidden">Toggle details pane</span>
              </button>
            </div>
          </div>
          <div></div>
        </div>
      </header>
      <div class="d-flex flex-grow-1 overflow-hidden">
        <aside
          class="d-none flex-column gap-4 border-end border-body-tertiary bg-body-tertiary p-4 shadow-theme flex-shrink-0 workbench-sidebar"
          data-pane="left"
          data-pane-collapsed-class="d-none"
          data-pane-expanded-class="d-flex"
          data-pane-initial="collapsed"
        >
          <div class="d-flex flex-column gap-3 overflow-auto" data-quick-reference></div>
        </aside>
        <main class="workbench-main flex-grow-1 bg-body-secondary py-4">
          <section class="container-xl d-flex flex-column gap-4">
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
              <h2 class="h4 mb-0 d-flex align-items-center gap-2">
                <span>Dashboard</span>
                <span class="align-middle" data-help-topic="dashboard.widgets" data-help-insert="replace"></span>
              </h2>
              <button class="btn btn-outline-secondary btn-sm" type="button" data-dashboard-edit-toggle>
                Edit layout
              </button>
            </div>
            <div class="d-none" data-dashboard-add-widget>
              <div class="d-flex align-items-end gap-2 flex-wrap">
                <div>
                  <label class="form-label small mb-1" for="dashboardAddWidgetSelect">Add a widget</label>
                  <select class="form-select form-select-sm" id="dashboardAddWidgetSelect" data-dashboard-add-select></select>
                </div>
                <button class="btn btn-primary btn-sm" type="button" data-dashboard-add-button>Add</button>
              </div>
            </div>
            <div class="dashboard-columns" data-dashboard-columns>
              <div class="dashboard-column d-flex flex-column gap-3" data-dashboard-column="0" data-sortable-group="dashboard-widgets"></div>
              <div class="dashboard-column d-flex flex-column gap-3" data-dashboard-column="1" data-sortable-group="dashboard-widgets"></div>
              <div class="dashboard-column d-flex flex-column gap-3" data-dashboard-column="2" data-sortable-group="dashboard-widgets"></div>
            </div>
          </section>
        </main>
        <aside
          class="d-none flex-column gap-3 border-start border-body-tertiary bg-body-tertiary p-4 shadow-theme flex-shrink-0 workbench-sidebar-lg overflow-hidden"
          data-pane="right"
          data-pane-collapsed-class="d-none"
          data-pane-expanded-class="d-flex"
          data-pane-initial="expanded"
        >
          <div class="d-flex flex-column gap-3 overflow-hidden" style="min-height: 0;" data-help-browser>
            <div>
              <h2 class="text-uppercase fs-6 fw-semibold text-body-secondary mb-1">Help &amp; Documentation</h2>
              <p class="fs-6 text-body-secondary mb-0">How each tool and shared concept works, in one place.</p>
              <a class="small" href="common/docs/index.html" target="_blank" rel="noopener noreferrer">
                Open the full documentation page &#8599;
              </a>
            </div>
            <input
              class="form-control form-control-sm"
              type="search"
              placeholder="Search topics…"
              aria-label="Search help topics"
              data-help-browser-search
            />
            <div class="d-flex flex-column gap-1 overflow-auto flex-grow-1" style="min-height: 0;" data-help-browser-list>
              <p class="text-body-secondary small mb-0">Loading topics…</p>
            </div>
            <div class="d-none flex-column gap-2 border-top pt-3 overflow-auto" data-help-browser-detail>
              <button
                class="btn btn-sm btn-link p-0 align-self-start text-decoration-none d-inline-flex align-items-center gap-1"
                type="button"
                data-help-browser-back
              >
                <span class="iconify" data-icon="tabler:arrow-left" aria-hidden="true"></span>
                Back to topics
              </button>
              <span class="badge text-bg-secondary align-self-start" data-help-browser-detail-category></span>
              <h3 class="h6 mb-0" data-help-browser-detail-title></h3>
              <p class="small text-body-secondary mb-0" data-help-browser-detail-summary></p>
              <ul class="small ps-3 mb-0 d-flex flex-column gap-1" data-help-browser-detail-list></ul>
            </div>
          </div>
        </aside>
      </div>
    </div>
    <div class="status-root" data-status-root></div>
    <!--
      The module script is placed BEFORE these classic deferred scripts on
      purpose. Both module scripts and `defer` scripts execute after parsing,
      in shared document order — so if this module tag came after them (as
      it originally did), its execution would wait for Iconify/Bootstrap/
      SortableJS to finish loading over the CDN before running at all, even
      though `defer` already made their *fetching* non-blocking. Confirmed
      directly (not just reasoned): with the old order, this page's own
      module code only started running once window.bootstrap/Iconify/
      Sortable were already defined; with this order, it runs before any of
      them exist. app-shell.js already treats window.bootstrap as optional
      (checks before using it), so nothing here actually needs the CDN
      scripts to have run first — the nav panel, panes, and theme controls
      don't touch any of them.
    -->
    <script type="module" src="dashboard.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/@iconify/iconify@3.1.1/dist/iconify.min.js"></script>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script defer src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
  </body>
</html>
