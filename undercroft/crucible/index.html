<!DOCTYPE html>
<html lang="en" data-theme="system">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Undercroft Crucible</title>
    <script src="../common/js/theme-init.js"></script>
    <link rel="stylesheet" href="../common/css/shell.css" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="bg-body text-body" data-undercroft-tool="crucible">
    <div class="d-flex flex-column min-vh-100 workbench-app">
      <div data-app-shell-header></div>

      <div class="d-flex flex-grow-1 workbench-shell">
        <div data-pane-content="left">
          <div class="btn-toolbar justify-content-center" role="toolbar" aria-label="Monster actions">
            <div class="btn-group" role="group" data-monster-toolbar-mount></div>
            <div class="btn-group ms-2" role="group" data-monster-undo-toolbar-mount></div>
          </div>

          <div data-selections-mount></div>
          <div class="d-flex flex-column gap-2" data-selections-panel>
            <div data-field-mount="system-select"></div>
            <div data-field-mount="monster-select"></div>

            <div class="d-flex flex-column gap-2" id="crucible-overrides" data-generation-fields>
              <div data-field-mount="creature-type-override"></div>
              <div data-field-mount="archetype-override"></div>
              <div data-field-mount="role-override"></div>
              <div data-field-mount="combat-scaling-override"></div>
              <div data-field-mount="signature-feature-override"></div>
              <div data-field-mount="locked-features"></div>
            </div>
          </div>

          <div class="mt-auto" id="crucible-json" data-json-mount></div>
        </div>

        <main class="workbench-main flex-grow-1 p-3 overflow-auto">
          <!-- The suite-wide Mode header — the "Nothing selected yet"
               empty-state message (condensed, left-aligned, no card — see
               js/app.js's own createEmptyStateCard "inline" variant call)
               flush on the left, ms-auto pushing Mode (Monster/Relationships,
               a real labeled button group) to the right regardless of
               whether the empty-state message is present. Same
               createModeToggleGroup pattern Repository/Forge's own header
               uses — see js/app.js's own renderModeToggle. Relationships
               mode always shows graph+list together now — no separate View
               toggle. -->
          <div class="d-flex align-items-center gap-2 mb-3" data-crucible-header>
            <div data-monster-empty-state></div>
            <div class="d-flex align-items-center gap-2 ms-auto">
              <div data-crucible-mode-toggle-mount></div>
            </div>
          </div>

          <div class="d-flex flex-column gap-3 d-none" data-monster-display>
            <div class="card shadow-theme">
              <div class="card-body">
                <div data-identity-mount></div>
                <div class="d-flex flex-column gap-2" data-identity-panel>
                  <div class="d-flex align-items-start gap-3 flex-wrap">
                    <div class="flex-grow-1" style="min-width: 12rem" data-field-mount="monster-name"></div>
                    <div style="max-width: 22rem; width: 100%" data-field-mount="monster-image"></div>
                  </div>
                  <div class="row g-3" data-identity-fields></div>
                </div>
              </div>
            </div>

            <div class="card shadow-theme">
              <div class="card-body">
                <section class="d-flex flex-column gap-2" id="crucible-features">
                  <div class="d-flex align-items-center justify-content-between gap-2 flex-wrap">
                    <h2 class="h6 text-uppercase fw-semibold text-body-secondary mb-0 d-flex align-items-center gap-2">
                      <span>Features</span>
                      <span class="align-middle" data-help-topic="crucible.features" data-help-insert="replace"></span>
                    </h2>
                    <div class="d-flex align-items-center gap-3">
                      <div class="d-flex align-items-center gap-3 small" data-budget-summary hidden>
                        <span class="text-body-secondary">Target <span class="fw-semibold" data-budget-target>0</span></span>
                        <span class="text-body-secondary">Spent <span class="fw-semibold" data-budget-spent>0</span></span>
                        <span class="text-body-secondary">Remaining <span class="fw-semibold" data-budget-remaining>0</span></span>
                      </div>
                      <span data-features-toggle-mount></span>
                    </div>
                  </div>
                  <div class="d-flex flex-column gap-2" data-features-panel>
                    <div class="d-flex flex-column gap-2" data-feature-list></div>
                    <div class="d-flex gap-2 align-items-center">
                      <select class="form-select" data-add-feature-select></select>
                      <button class="btn btn-outline-secondary flex-shrink-0 d-flex align-items-center gap-1" type="button" data-add-feature-button>
                        <span class="iconify" data-icon="tabler:plus" aria-hidden="true"></span>
                        Add
                      </button>
                    </div>
                  </div>
                </section>
              </div>
            </div>

            <div class="card shadow-theme">
              <div class="card-body">
                <div data-stats-mount></div>
                <div class="d-flex flex-column gap-2" data-stats-panel>
                  <div class="row g-3" data-stats-fields></div>
                </div>
              </div>
            </div>

            <div class="card shadow-theme">
              <div class="card-body">
                <section class="d-flex flex-column gap-2" id="crucible-notes">
                  <div class="d-flex align-items-center justify-content-between gap-2 flex-wrap">
                    <h2 class="h6 text-uppercase fw-semibold text-body-secondary mb-0 d-flex align-items-center gap-2">
                      <span>Notes (optional)</span>
                      <span class="align-middle" data-help-topic="crucible.notes" data-help-insert="replace"></span>
                    </h2>
                    <div class="d-flex align-items-center gap-2">
                      <button
                        class="btn btn-outline-secondary btn-sm"
                        type="button"
                        data-notes-mode-toggle
                        data-bs-toggle="tooltip"
                        data-bs-title="Edit"
                      >
                        <span class="iconify d-none" data-icon="tabler:eye" aria-hidden="true" data-notes-mode-icon="view"></span>
                        <span class="iconify" data-icon="tabler:pencil" aria-hidden="true" data-notes-mode-icon="edit"></span>
                        <span data-notes-mode-label>Edit</span>
                      </button>
                      <button class="btn btn-outline-secondary btn-sm" type="button" data-generate-note>
                        <span class="iconify" data-icon="tabler:sparkles" aria-hidden="true"></span>
                        Generate Note
                      </button>
                      <span data-notes-toggle-mount></span>
                    </div>
                  </div>
                  <div class="d-flex flex-column gap-2" data-notes-panel>
                    <textarea class="form-control d-none" rows="3" data-notes-text placeholder="Type a note, or Generate Note to have Claude write one."></textarea>
                    <div data-notes-preview></div>
                  </div>
                </section>
              </div>
            </div>

            <div class="card shadow-theme" data-recipe-card>
              <div class="card-body">
                <div data-recipe-mount></div>
                <div class="d-flex flex-column gap-1 small" data-recipe-panel>
                  <div class="d-flex flex-column gap-1 small" data-recipe-summary></div>
                </div>
              </div>
            </div>

          </div>

          <!-- Relationships — a second, mutually-exclusive Mode (not a card
               inside Monster mode anymore) — see js/app.js's own setMode.
               Graph and the relationship list/Add-relationship editor are
               always shown together now (no more List/Graph view toggle) —
               graph on top, editor underneath. -->
          <div class="d-none card shadow-theme" data-monster-relationships>
            <div class="card-body d-flex flex-column gap-2">
              <div data-relationships-graph-wrap>
                <div class="relationship-graph-stage" data-relationships-graph-container>
                  <div class="relationship-graph-content" data-relationships-graph-content>
                    <svg data-relationships-graph-svg viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid meet"></svg>
                  </div>
                  <div class="relationship-graph-controls d-flex align-items-center gap-2" data-relationships-graph-controls>
                    <div class="btn-group btn-group-sm" role="group" aria-label="Relationships zoom controls" data-relationships-graph-toolbar-mount></div>
                  </div>
                </div>
                <div class="d-none" data-relationships-graph-empty></div>
              </div>
              <div data-relationships-list-mount></div>
            </div>
          </div>
        </main>

        <div data-pane-content="right">
          <div data-inspector-mount></div>
          <div class="d-flex flex-column gap-3" data-inspector-panel>
            <div data-inspector-empty class="border border-dashed rounded-3 p-3 text-center text-body-secondary small">
              Select a feature in the Features list to see its full detail here.
            </div>
            <div data-inspector-detail class="d-none">
              <div class="btn-toolbar justify-content-center overflow-x-auto mb-3" role="toolbar" aria-label="Feature actions">
                <div class="btn-group" role="group" aria-label="Feature actions" data-feature-inspector-toolbar-mount></div>
              </div>
              <div class="d-flex flex-column gap-2 mb-3" data-feature-basic-info>
                <div class="d-flex align-items-center gap-2">
                  <span class="small fw-semibold text-body-secondary">Basic Info</span>
                  <span class="align-middle" data-help-topic="crucible.feature-basic-info" data-help-insert="replace"></span>
                </div>
                <div class="d-flex flex-column gap-1">
                  <label class="form-label small mb-0 text-body-secondary">ID</label>
                  <input type="text" class="form-control form-control-sm" data-feature-basic-id disabled />
                </div>
                <div class="d-flex flex-column gap-1">
                  <label class="form-label small mb-0 text-body-secondary">Name</label>
                  <input type="text" class="form-control form-control-sm" data-feature-basic-name disabled />
                </div>
                <div class="d-flex flex-column gap-1">
                  <label class="form-label small mb-0 text-body-secondary">Description</label>
                  <textarea class="form-control form-control-sm" rows="3" data-feature-basic-description disabled></textarea>
                </div>
                <div class="d-flex flex-column gap-1">
                  <label class="form-label small mb-0 text-body-secondary">Budget Cost</label>
                  <input type="number" min="0" class="form-control form-control-sm" data-feature-basic-budget-cost disabled />
                </div>
              </div>
              <div class="d-flex flex-column gap-2 mb-3 d-none" data-multiattack-editor>
                <div class="d-flex align-items-center justify-content-between gap-2">
                  <span class="small fw-semibold text-body-secondary">Attacks</span>
                  <span class="align-middle" data-help-topic="crucible.multiattack-attacks" data-help-insert="replace"></span>
                </div>
                <div class="d-flex flex-column gap-3" data-multiattack-options></div>
                <p class="small text-body-secondary mb-0 d-none" data-multiattack-empty-note>
                  No attacks listed — the text below is shown as typed rather than computed.
                </p>
                <button
                  class="btn btn-outline-secondary btn-sm align-self-start"
                  type="button"
                  data-bs-toggle="tooltip"
                  data-bs-title="Add an alternative combination of attacks (for a Multiattack that's a choice, like &quot;two Claws, two Bites, or one of each&quot;)"
                  data-multiattack-add-option-button
                >
                  <span class="iconify" data-icon="tabler:plus" aria-hidden="true"></span>
                  Add option
                </button>
              </div>
              <div class="d-flex flex-column gap-2 mb-3 d-none" data-feature-params-editor></div>
              <div data-inspector-json-mount></div>
              <pre class="border rounded-3 p-2 bg-body small mb-0" data-inspector-json></pre>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="status-root" data-status-root></div>

    <!-- Module script placed before the deferred CDN scripts on purpose —
         both execute in shared document order after parsing, so this
         ordering keeps the page's own JS from waiting on the CDN scripts
         to finish loading before it can run. See undercroft/index.html for
         the full explanation. -->
    <script type="module" src="js/app.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/@iconify/iconify@3.1.1/dist/iconify.min.js"></script>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <!-- Repository's own renderMarkdown (js/lib/markdown.js) is reused
         as-is for the Notes preview below — it checks for window.marked/
         window.DOMPurify at call time, not module load, so loading these
         `defer`red like every other CDN script here is safe. -->
    <script defer src="https://cdn.jsdelivr.net/npm/marked@18.0.7/lib/marked.umd.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/dompurify@3.4.12/dist/purify.min.js"></script>
  </body>
</html>
