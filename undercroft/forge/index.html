<!DOCTYPE html>
<html lang="en" data-theme="system">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Undercroft Forge</title>
    <script src="../common/js/theme-init.js"></script>
    <link rel="stylesheet" href="../common/css/shell.css" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="bg-body text-body" data-undercroft-tool="forge">
    <div class="d-flex flex-column min-vh-100 workbench-app">
      <div data-app-shell-header></div>

      <div class="d-flex flex-grow-1 workbench-shell">
        <div data-pane-content="left">
          <div class="btn-toolbar justify-content-center" role="toolbar" aria-label="NPC actions">
            <div class="btn-group" role="group" data-npc-toolbar-mount></div>
            <div class="btn-group ms-2" role="group" data-npc-undo-toolbar-mount></div>
          </div>

          <div data-selections-mount></div>
          <div class="d-flex flex-column gap-2" data-selections-panel>
            <div data-field-mount="system-select"></div>
            <div data-field-mount="setting-select"></div>
            <div data-field-mount="location-select"></div>
            <div data-field-mount="npc-select"></div>

            <div class="d-flex flex-column gap-2" id="forge-overrides" data-generation-fields>
              <div data-field-mount="species-override"></div>
              <div data-field-mount="archetype-override"></div>
              <div data-field-mount="alignment-override"></div>
              <div data-field-mount="gender-override"></div>
            </div>
          </div>

          <div class="mt-auto" id="forge-json" data-json-mount></div>
        </div>

        <main class="workbench-main flex-grow-1 p-3 overflow-auto">
          <!-- The suite-wide Mode header — the "Nothing selected yet"
               empty-state message (condensed, left-aligned, no card — see
               js/app.js's own createEmptyStateCard "inline" variant call)
               flush on the left, ms-auto pushing Mode (NPC/Relationships, a
               real labeled button group) to the right regardless of whether
               the empty-state message is present. Same createModeToggleGroup
               pattern Repository's own header uses — see js/app.js's own
               renderModeToggle. Relationships mode always shows graph+list
               together now — no separate View toggle. -->
          <div class="d-flex align-items-center gap-2 mb-3" data-forge-header>
            <div data-npc-empty-state></div>
            <div class="d-flex align-items-center gap-2 ms-auto">
              <div data-forge-mode-toggle-mount></div>
            </div>
          </div>

          <div class="d-flex flex-column gap-3 d-none" data-npc-display>
            <div class="card shadow-theme">
              <div class="card-body">
                <div data-identity-mount></div>
                <div class="d-flex flex-column gap-3" data-identity-panel>
                  <div class="d-flex align-items-start gap-3 flex-wrap">
                    <div class="flex-grow-1" style="min-width: 12rem" data-name-mount></div>
                    <div style="max-width: 22rem; width: 100%" data-field-mount="npc-image"></div>
                  </div>
                  <div class="row g-3" data-identity-fields></div>
                </div>
              </div>
            </div>

            <div class="card shadow-theme">
              <div class="card-body">
                <div data-fourd-mount></div>
                <div class="d-flex flex-column gap-3" data-fourd-panel>
                  <div class="row g-3" data-fourd-fields></div>
                </div>
              </div>
            </div>

            <div class="card shadow-theme">
              <div class="card-body">
                <div data-stats-mount></div>
                <div class="d-flex flex-column gap-3" data-stats-panel>
                  <div class="row g-3" data-stats-fields></div>
                </div>
              </div>
            </div>

            <div class="card shadow-theme">
              <div class="card-body">
                <div data-skills-mount></div>
                <div class="d-flex flex-column gap-3" data-skills-panel>
                  <div class="row g-3" data-skills-fields></div>
                </div>
              </div>
            </div>

            <div class="card shadow-theme">
              <div class="card-body">
                <div data-features-mount></div>
                <div class="d-flex flex-column gap-3" data-features-panel>
                  <div class="d-flex flex-column gap-2" data-feature-list></div>
                  <div class="d-flex gap-2 align-items-center">
                    <select class="form-select" data-add-feature-select></select>
                    <button class="btn btn-outline-secondary flex-shrink-0 d-flex align-items-center gap-1" type="button" data-add-feature-button>
                      <span class="iconify" data-icon="tabler:plus" aria-hidden="true"></span>
                      Add
                    </button>
                  </div>
                  <!-- Inline, not routed through the right-pane Inspector the
                       way Crucible/Vault's own equivalent lives — that pane
                       is already Forge's own Location Details editor, a
                       different purpose entirely, and Forge has no general
                       "selected sub-component" editing concept to hang this
                       off of instead. -->
                  <div class="d-flex flex-column gap-2 d-none" data-feature-params-editor></div>
                </div>
              </div>
            </div>

            <div class="card shadow-theme">
              <div class="card-body">
                <section class="d-flex flex-column gap-3" id="forge-note">
                  <div class="d-flex align-items-center justify-content-between gap-2 flex-wrap">
                    <h2 class="h6 text-uppercase fw-semibold text-body-secondary mb-0 d-flex align-items-center gap-2">
                      <span>Notes (optional)</span>
                      <span class="align-middle" data-help-topic="forge.note" data-help-insert="replace"></span>
                    </h2>
                    <div class="d-flex align-items-center gap-2">
                      <button
                        class="btn btn-outline-secondary btn-sm"
                        type="button"
                        data-note-mode-toggle
                        data-bs-toggle="tooltip"
                        data-bs-title="Edit"
                      >
                        <span class="iconify d-none" data-icon="tabler:eye" aria-hidden="true" data-note-mode-icon="view"></span>
                        <span class="iconify" data-icon="tabler:pencil" aria-hidden="true" data-note-mode-icon="edit"></span>
                        <span data-note-mode-label>Edit</span>
                      </button>
                      <button class="btn btn-outline-secondary btn-sm" type="button" data-generate-note>
                        <span class="iconify" data-icon="tabler:sparkles" aria-hidden="true"></span>
                        Generate Note
                      </button>
                      <span data-note-toggle-mount></span>
                    </div>
                  </div>
                  <div class="d-flex flex-column gap-2" data-note-panel>
                    <textarea class="form-control d-none" rows="3" data-note-text placeholder="Type a note, or Generate Note to have Claude write one."></textarea>
                    <div data-note-preview></div>
                  </div>
                </section>
              </div>
            </div>

          </div>

          <!-- Relationships — a second, mutually-exclusive Mode (not a card
               inside NPC mode anymore) — see js/app.js's own setMode. Graph
               and the relationship list/Add-relationship editor are now
               always shown together (no more List/Graph view toggle) —
               graph on top, editor underneath. -->
          <div class="d-none card shadow-theme" data-npc-relationships>
            <div class="card-body d-flex flex-column gap-2">
              <div data-relationships-graph-wrap>
                <div class="relationship-graph-stage" data-relationships-graph-container>
                  <div class="relationship-graph-content" data-relationships-graph-content>
                    <svg data-relationships-graph-svg viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid meet"></svg>
                  </div>
                  <div class="relationship-graph-controls d-flex align-items-center gap-2" data-relationships-graph-controls>
                    <div class="btn-group btn-group-sm" role="group" aria-label="Relationships zoom controls" data-relationships-graph-toolbar-mount></div>
                  </div>
                </div>
                <div class="d-none" data-relationships-graph-empty></div>
              </div>
              <div data-relationships-list-mount></div>
            </div>
          </div>
        </main>

        <div data-pane-content="right">
          <section class="d-flex flex-column gap-3" data-identity-inspector>
              <div data-inspector-mount></div>
              <div class="d-flex flex-column gap-3" data-inspector-panel>
                <div data-inspector-empty></div>

                <div class="d-flex flex-column gap-3" data-inspector-location hidden>
              <div class="d-flex align-items-center justify-content-between gap-2 flex-wrap">
                <h3 class="fs-6 fw-semibold text-body-secondary mb-0 d-flex align-items-center gap-2">
                  <span>Location Details</span>
                  <span class="align-middle" data-help-topic="forge.locations" data-help-insert="replace"></span>
                </h3>
                <span data-export-location-template-mount></span>
              </div>
              <div class="d-flex flex-column gap-2">
                <div data-field-mount="location-name"></div>
                <div data-field-mount="location-system"></div>
                <div data-field-mount="location-setting"></div>
              </div>

              <section class="d-flex flex-column gap-2" id="forge-species-weights">
                <div class="d-flex align-items-center justify-content-between gap-2">
                  <h3 class="fs-6 fw-semibold text-body-secondary mb-0 d-flex align-items-center gap-2">
                    <span>Species Weights</span>
                    <span class="align-middle" data-help-topic="forge.speciesWeights" data-help-insert="replace"></span>
                  </h3>
                  <div class="d-flex align-items-center gap-2">
                    <span class="small text-body-secondary" data-species-weight-total>Total: 0</span>
                  </div>
                </div>
                <div
                  class="d-flex flex-column gap-2 border rounded-3 p-2 overflow-auto"
                  style="max-height: 24rem"
                  data-species-weight-rows
                ></div>
              </section>

              <section class="d-flex flex-column gap-2" id="forge-mixing-coefficient">
                <h3 class="fs-6 fw-semibold text-body-secondary mb-0 d-flex align-items-center gap-2">
                  <span>Mixing Coefficient</span>
                  <span class="align-middle" data-help-topic="forge.mixingCoefficient" data-help-insert="replace"></span>
                </h3>
                <div class="d-flex align-items-center gap-2">
                  <input
                    class="form-range"
                    type="range"
                    min="0"
                    max="1"
                    step="0.05"
                    data-mixing-coefficient
                    disabled
                  />
                  <span class="small text-body-secondary" style="min-width: 3rem" data-mixing-coefficient-value>0.00</span>
                </div>
              </section>

              <section class="d-flex flex-column gap-2" id="forge-archetype-overrides">
                <h3 class="fs-6 fw-semibold text-body-secondary mb-0 d-flex align-items-center gap-2">
                  <span>Setting-Specific Archetypes</span>
                  <span class="align-middle" data-help-topic="forge.archetypeOverrides" data-help-insert="replace"></span>
                </h3>
                <div class="d-flex flex-column gap-2" data-archetype-override-rows></div>
              </section>
            </div>

            <div class="d-flex flex-column gap-3" data-inspector-species hidden id="forge-manage-species">
              <h3 class="fs-6 fw-semibold text-body-secondary mb-0 d-flex align-items-center gap-2">
                <span>Species Name Profile</span>
                <span class="align-middle" data-help-topic="forge.speciesProfileEditor" data-help-insert="replace"></span>
              </h3>
              <div class="d-flex flex-column gap-2">
                <div data-field-mount="species-label"></div>
                <div data-field-mount="species-name-mode"></div>
                <div data-field-mount="species-last-name-form"></div>
              </div>

              <div data-field-mount="species-first-names"></div>

              <div data-species-last-names-group>
                <div data-field-mount="species-last-names"></div>
              </div>
            </div>

            <div class="d-flex flex-column gap-2" data-inspector-roll hidden>
              <h2 class="text-uppercase fs-6 fw-semibold text-body-secondary mb-0" data-inspector-roll-title></h2>
              <p class="small text-body-secondary mb-0" data-inspector-roll-current></p>
              <pre class="border rounded-3 p-2 bg-body small mb-0" data-inspector-roll-json></pre>
                </div>
              </div>
            </section>
        </div>
      </div>
    </div>

    <div class="status-root" data-status-root></div>

    <!-- Module script placed before the deferred CDN scripts on purpose —
         both execute in shared document order after parsing, so this
         ordering keeps the page's own JS from waiting on the CDN scripts
         to finish loading before it can run. See undercroft/index.html for
         the full explanation. -->
    <script type="module" src="js/app.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/@iconify/iconify@3.1.1/dist/iconify.min.js"></script>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <!-- Repository's own renderMarkdown-shaped rendering (library-reference.js's
         own renderNotesPreview, for reference-chip hover previews) checks for
         window.marked/window.DOMPurify at call time, not module load, so
         loading these `defer`red like every other CDN script here is safe. -->
    <script defer src="https://cdn.jsdelivr.net/npm/marked@18.0.7/lib/marked.umd.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/dompurify@3.4.12/dist/purify.min.js"></script>
  </body>
</html>
