<!DOCTYPE html>
<html lang="en" data-theme="system">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Undercroft Forge</title>
    <script src="../common/js/theme-init.js"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../common/css/shell.css" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="bg-body text-body" data-undercroft-tool="forge">
    <div class="d-flex flex-column min-vh-100 workbench-app">
      <div data-app-shell-header></div>

      <div class="d-flex flex-grow-1 workbench-shell">
        <div data-pane-content="left">
          <div class="btn-toolbar justify-content-center" role="toolbar" aria-label="NPC actions">
            <div class="btn-group" role="group" data-npc-toolbar-mount></div>
          </div>

          <section class="d-flex flex-column gap-2" id="forge-generate">
            <div data-field-mount="system-select"></div>
            <div data-field-mount="setting-select"></div>
            <div data-field-mount="location-select"></div>

            <div class="d-flex flex-column gap-2" id="forge-overrides">
              <div data-field-mount="species-override"></div>
              <div data-field-mount="archetype-override"></div>
              <div data-field-mount="alignment-override"></div>
              <div data-field-mount="gender-override"></div>
            </div>
          </section>

          <div class="mt-auto" id="forge-json" data-json-mount></div>
        </div>

        <main class="workbench-main flex-grow-1 p-3 overflow-auto">
          <div class="d-flex flex-column gap-3" data-npc-empty-state></div>

          <div class="d-flex flex-column gap-3 d-none" data-npc-display>
            <div class="card shadow-theme">
              <div class="card-body">
                <section class="d-flex flex-column gap-3" id="forge-identity">
                  <div class="d-flex align-items-center justify-content-between gap-2 flex-wrap">
                    <h2 class="h6 text-uppercase fw-semibold text-body-secondary mb-0 d-flex align-items-center gap-2">
                      <span>Identity</span>
                      <span class="align-middle" data-help-topic="forge.identity" data-help-insert="replace"></span>
                    </h2>
                  </div>
                  <div class="col-12 col-md-6 col-lg-4" style="max-width: 22rem" data-field-mount="npc-image"></div>
                  <div class="row g-3" data-identity-fields></div>
                </section>
              </div>
            </div>

            <div class="card shadow-theme">
              <div class="card-body">
                <section class="d-flex flex-column gap-3" id="forge-fourd">
                  <h2 class="h6 text-uppercase fw-semibold text-body-secondary mb-0 d-flex align-items-center gap-2">
                    <span>4D</span>
                    <span class="align-middle" data-help-topic="forge.fourD" data-help-insert="replace"></span>
                  </h2>
                  <div class="row g-3" data-fourd-fields></div>
                </section>
              </div>
            </div>

            <div class="card shadow-theme">
              <div class="card-body">
                <section class="d-flex flex-column gap-3" id="forge-stats">
                  <h2 class="h6 text-uppercase fw-semibold text-body-secondary mb-0 d-flex align-items-center gap-2">
                    <span>Stats</span>
                    <span class="align-middle" data-help-topic="forge.stats" data-help-insert="replace"></span>
                  </h2>
                  <div class="row g-3" data-stats-fields></div>
                </section>
              </div>
            </div>

            <div class="card shadow-theme">
              <div class="card-body">
                <section class="d-flex flex-column gap-3" id="forge-note">
                  <div class="d-flex align-items-center justify-content-between gap-2 flex-wrap">
                    <h2 class="h6 text-uppercase fw-semibold text-body-secondary mb-0 d-flex align-items-center gap-2">
                      <span>Character Note (optional)</span>
                      <span class="align-middle" data-help-topic="forge.note" data-help-insert="replace"></span>
                    </h2>
                    <button class="btn btn-outline-secondary btn-sm" type="button" data-generate-note>
                      <span class="iconify" data-icon="tabler:sparkles" aria-hidden="true"></span>
                      Generate Note
                    </button>
                  </div>
                  <textarea class="form-control" rows="3" data-note-text placeholder="Type a note, or Generate Note to have Claude write one."></textarea>
                </section>
              </div>
            </div>
          </div>
        </main>

        <div data-pane-content="right">
          <section class="d-flex flex-column gap-3" data-identity-inspector>
              <div data-inspector-mount></div>
              <div class="d-flex flex-column gap-3" data-inspector-panel>
                <div data-inspector-empty></div>

                <div class="d-flex flex-column gap-3" data-inspector-location hidden>
              <div class="d-flex align-items-center justify-content-between gap-2 flex-wrap">
                <h3 class="fs-6 fw-semibold text-body-secondary mb-0 d-flex align-items-center gap-2">
                  <span>Location Details</span>
                  <span class="align-middle" data-help-topic="forge.locations" data-help-insert="replace"></span>
                </h3>
                <span data-export-location-template-mount></span>
              </div>
              <div class="d-flex flex-column gap-2">
                <div data-field-mount="location-name"></div>
                <div data-field-mount="location-system"></div>
                <div data-field-mount="location-setting"></div>
              </div>

              <section class="d-flex flex-column gap-2" id="forge-species-weights">
                <div class="d-flex align-items-center justify-content-between gap-2">
                  <h3 class="fs-6 fw-semibold text-body-secondary mb-0 d-flex align-items-center gap-2">
                    <span>Species Weights</span>
                    <span class="align-middle" data-help-topic="forge.speciesWeights" data-help-insert="replace"></span>
                  </h3>
                  <div class="d-flex align-items-center gap-2">
                    <span class="small text-body-secondary" data-species-weight-total>Total: 0</span>
                  </div>
                </div>
                <div
                  class="d-flex flex-column gap-2 border rounded-3 p-2 overflow-auto"
                  style="max-height: 24rem"
                  data-species-weight-rows
                ></div>
              </section>

              <section class="d-flex flex-column gap-2" id="forge-mixing-coefficient">
                <h3 class="fs-6 fw-semibold text-body-secondary mb-0 d-flex align-items-center gap-2">
                  <span>Mixing Coefficient</span>
                  <span class="align-middle" data-help-topic="forge.mixingCoefficient" data-help-insert="replace"></span>
                </h3>
                <div class="d-flex align-items-center gap-2">
                  <input
                    class="form-range"
                    type="range"
                    min="0"
                    max="1"
                    step="0.05"
                    data-mixing-coefficient
                    disabled
                  />
                  <span class="small text-body-secondary" style="min-width: 3rem" data-mixing-coefficient-value>0.00</span>
                </div>
              </section>

              <section class="d-flex flex-column gap-2" id="forge-archetype-overrides">
                <h3 class="fs-6 fw-semibold text-body-secondary mb-0 d-flex align-items-center gap-2">
                  <span>Setting-Specific Archetypes</span>
                  <span class="align-middle" data-help-topic="forge.archetypeOverrides" data-help-insert="replace"></span>
                </h3>
                <div class="d-flex flex-column gap-2" data-archetype-override-rows></div>
              </section>
            </div>

            <div class="d-flex flex-column gap-3" data-inspector-species hidden id="forge-manage-species">
              <h3 class="fs-6 fw-semibold text-body-secondary mb-0 d-flex align-items-center gap-2">
                <span>Species Name Profile</span>
                <span class="align-middle" data-help-topic="forge.speciesProfileEditor" data-help-insert="replace"></span>
              </h3>
              <div class="d-flex flex-column gap-2">
                <div data-field-mount="species-label"></div>
                <div data-field-mount="species-name-mode"></div>
                <div data-field-mount="species-last-name-form"></div>
              </div>

              <div data-field-mount="species-first-names"></div>

              <div data-species-last-names-group>
                <div data-field-mount="species-last-names"></div>
              </div>
            </div>

            <div class="d-flex flex-column gap-2" data-inspector-roll hidden>
              <h2 class="text-uppercase fs-6 fw-semibold text-body-secondary mb-0" data-inspector-roll-title></h2>
              <p class="small text-body-secondary mb-0" data-inspector-roll-current></p>
              <pre class="border rounded-3 p-2 bg-body small mb-0" data-inspector-roll-json></pre>
                </div>
              </div>
            </section>
        </div>
      </div>
    </div>

    <div class="status-root" data-status-root></div>

    <!-- Module script placed before the deferred CDN scripts on purpose —
         both execute in shared document order after parsing, so this
         ordering keeps the page's own JS from waiting on the CDN scripts
         to finish loading before it can run. See undercroft/index.html for
         the full explanation. -->
    <script type="module" src="js/app.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/@iconify/iconify@3.1.1/dist/iconify.min.js"></script>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
