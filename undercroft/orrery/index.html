<!DOCTYPE html>
<html lang="en" data-theme="system">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Undercroft Orrery</title>
    <script src="../common/js/theme-init.js"></script>
    <link rel="stylesheet" href="../common/vendor/leaflet/leaflet.css" />
    <link rel="stylesheet" href="../common/vendor/bootstrap-icons/bootstrap-icons.css" />
    <link rel="stylesheet" href="../common/css/shell.css" />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="../common/css/ddb-icons.css" />
  </head>
  <body class="bg-body text-body" data-undercroft-tool="orrery">
    <div id="orrery-map" class="orrery-map" role="img" aria-label="Orrery map viewport"></div>

    <div class="d-flex flex-column min-vh-100 workbench-app orrery-shell">
      <div data-app-shell-header></div>

      <div class="d-flex flex-grow-1 workbench-shell">
        <div data-pane-content="left">
            <section class="d-flex flex-column gap-3">
              <div class="btn-toolbar justify-content-center" role="toolbar" aria-label="Orrery actions">
                <div class="btn-group" role="group" data-map-toolbar-mount></div>
                <div class="btn-group ms-2" role="group" data-map-undo-toolbar-mount></div>
              </div>
            </section>

            <div data-selections-mount></div>
            <div class="d-flex flex-column gap-2" data-selections-panel>
              <div data-field-mount="map-select"></div>
            </div>

            <section class="d-flex flex-column gap-3">
              <div class="d-flex align-items-center justify-content-between">
                <div class="d-flex align-items-center gap-2">
                  <h2 class="h6 text-uppercase fw-semibold text-body-secondary mb-0">Layers</h2>
                  <span data-layers-help-mount></span>
                </div>
                <div class="btn-toolbar" role="toolbar" aria-label="Add layers">
                  <div class="btn-group btn-group-sm" role="group" data-add-layer-mount></div>
                </div>
              </div>
              <div class="list-group orrery-pane-list" data-layer-list></div>
            </section>

            <section class="d-flex flex-column gap-3">
              <div class="d-flex align-items-center justify-content-between">
                <div class="d-flex align-items-center gap-2">
                  <h2 class="h6 text-uppercase fw-semibold text-body-secondary mb-0">Groups</h2>
                  <span data-groups-help-mount></span>
                </div>
                <div class="btn-toolbar" role="toolbar" aria-label="Add group">
                  <div class="btn-group btn-group-sm" role="group" data-add-group-mount></div>
                </div>
              </div>
              <div class="list-group orrery-pane-list" data-group-list></div>
            </section>

            <section class="d-flex flex-column gap-3">
              <div class="d-flex align-items-center justify-content-between">
                <div class="d-flex align-items-center gap-2">
                  <h2 class="h6 text-uppercase fw-semibold text-body-secondary mb-0">Views</h2>
                  <span data-help-topic="orrery.views" data-help-insert="replace"></span>
                </div>
                <div class="btn-toolbar" role="toolbar" aria-label="Add view">
                  <div class="btn-group btn-group-sm" role="group" data-add-view-mount></div>
                </div>
              </div>
              <div class="list-group orrery-pane-list" data-view-list></div>
            </section>

            <div class="mt-auto" id="orrery-json" data-json-mount></div>
        </div>

        <main class="flex-grow-1 position-relative workbench-main" data-map-main>
          <div class="orrery-floating-panel shadow-theme" data-view-panel>
            <div class="d-flex flex-column gap-1 orrery-view-handle" data-view-handle>
              <div class="d-flex align-items-center gap-2 flex-wrap">
                <div class="btn-group btn-group-sm" role="group" aria-label="Map zoom controls">
                  <button class="btn btn-outline-secondary" type="button" data-zoom-out data-bs-toggle="tooltip" data-bs-title="Zoom out">
                    <span class="iconify" data-icon="tabler:zoom-out" aria-hidden="true"></span>
                    <span class="visually-hidden">Zoom out</span>
                  </button>
                  <button class="btn btn-outline-secondary" type="button" data-zoom-reset>Reset</button>
                  <button class="btn btn-outline-secondary" type="button" data-zoom-in data-bs-toggle="tooltip" data-bs-title="Zoom in">
                    <span class="iconify" data-icon="tabler:zoom-in" aria-hidden="true"></span>
                    <span class="visually-hidden">Zoom in</span>
                  </button>
                </div>
                <span
                  class="d-inline-block"
                  tabindex="0"
                  data-ping-toggle-wrap
                  data-bs-toggle="tooltip"
                  data-bs-placement="top"
                  data-bs-title="Click the map to ping"
                >
                  <button class="btn btn-outline-secondary btn-sm" type="button" data-ping-toggle aria-pressed="false">
                    <span class="iconify" data-icon="tabler:location" aria-hidden="true"></span>
                    <span class="visually-hidden">Ping the map</span>
                  </button>
                </span>
                <span
                  class="d-inline-block"
                  tabindex="0"
                  data-measure-toggle-wrap
                  data-bs-toggle="tooltip"
                  data-bs-placement="top"
                  data-bs-title="Measure distance"
                >
                  <button class="btn btn-outline-secondary btn-sm" type="button" data-measure-toggle aria-pressed="false">
                    <span class="iconify" data-icon="tabler:ruler-2" aria-hidden="true"></span>
                    <span class="visually-hidden">Measure distance</span>
                  </button>
                </span>
                <span
                  class="d-inline-block"
                  tabindex="0"
                  data-draw-toggle-wrap
                  data-bs-toggle="tooltip"
                  data-bs-placement="top"
                  data-bs-title="Draw on the map"
                >
                  <button class="btn btn-outline-secondary btn-sm" type="button" data-draw-toggle aria-pressed="false">
                    <span class="iconify" data-icon="tabler:pencil" aria-hidden="true"></span>
                    <span class="visually-hidden">Draw</span>
                  </button>
                </span>
                <span
                  class="d-inline-block"
                  tabindex="0"
                  data-shape-toggle-wrap
                  data-bs-toggle="tooltip"
                  data-bs-placement="top"
                  data-bs-title="Draw a Shape/Effect"
                >
                  <button class="btn btn-outline-secondary btn-sm" type="button" data-shape-toggle aria-pressed="false">
                    <span class="iconify" data-icon="tabler:target" aria-hidden="true"></span>
                    <span class="visually-hidden">Shape/Effect</span>
                  </button>
                </span>
                <span
                  class="d-inline-block"
                  tabindex="0"
                  data-wall-toggle-wrap
                  data-bs-toggle="tooltip"
                  data-bs-placement="top"
                  data-bs-title="Draw a wall or door"
                >
                  <button class="btn btn-outline-secondary btn-sm" type="button" data-wall-toggle aria-pressed="false">
                    <span class="iconify" data-icon="tabler:wall" aria-hidden="true"></span>
                    <span class="visually-hidden">Wall / Door</span>
                  </button>
                </span>
                <span
                  class="d-inline-block"
                  tabindex="0"
                  data-light-toggle-wrap
                  data-bs-toggle="tooltip"
                  data-bs-placement="top"
                  data-bs-title="Place a dynamic light"
                >
                  <button class="btn btn-outline-secondary btn-sm" type="button" data-light-toggle aria-pressed="false">
                    <span class="iconify" data-icon="tabler:bulb" aria-hidden="true"></span>
                    <span class="visually-hidden">Dynamic light</span>
                  </button>
                </span>
                <button class="btn btn-outline-secondary btn-sm ms-auto" type="button" data-view-toggle aria-expanded="false" data-bs-toggle="tooltip" data-bs-title="Expand view details">
                  <span class="iconify" data-icon="tabler:chevron-left" aria-hidden="true"></span>
                  <span class="visually-hidden">Expand view details</span>
                </button>
              </div>
              <div class="d-flex align-items-center gap-2 flex-wrap">
                <span
                  class="d-inline-block d-none"
                  tabindex="0"
                  data-draw-color-wrap
                  data-bs-toggle="tooltip"
                  data-bs-placement="top"
                  data-bs-title="Drawing color"
                >
                  <input
                    class="form-control form-control-color form-control-sm p-1"
                    type="color"
                    data-draw-color
                    value="#0f172a"
                    aria-label="Drawing color"
                  />
                </span>
                <span
                  class="d-inline-block d-none"
                  tabindex="0"
                  data-wall-snap-toggle-wrap
                  data-bs-toggle="tooltip"
                  data-bs-placement="top"
                  data-bs-title="Snap wall vertices to the grid"
                >
                  <button class="btn btn-outline-secondary btn-sm" type="button" data-wall-snap-toggle aria-pressed="true">
                    <span class="iconify" data-icon="tabler:magnet" aria-hidden="true"></span>
                    <span class="visually-hidden">Snap to grid</span>
                  </button>
                </span>
              </div>
              <div class="d-flex align-items-center gap-2 flex-wrap">
                <span class="small text-body-secondary d-none" data-measure-readout></span>
              </div>
            </div>
            <div class="orrery-view-details mt-2 d-none" data-view-details>
              <dl class="mb-0 small">
                <div class="d-flex justify-content-between">
                  <dt>Mode</dt>
                  <dd class="mb-0" data-view-mode></dd>
                </div>
                <div class="d-flex justify-content-between">
                  <dt>Zoom</dt>
                  <dd class="mb-0" data-view-zoom></dd>
                </div>
                <div class="d-flex justify-content-between">
                  <dt>Center</dt>
                  <dd class="mb-0" data-view-center></dd>
                </div>
                <div class="d-flex justify-content-between">
                  <dt>Pan</dt>
                  <dd class="mb-0" data-view-pan></dd>
                </div>
              </dl>
            </div>
          </div>
          <div class="orrery-empty-state d-none" data-map-empty-state></div>
        </main>

        <div data-pane-content="right">
            <section class="d-flex flex-column gap-3">
              <div class="d-flex align-items-center justify-content-between">
                <div class="d-flex align-items-center gap-2">
                  <h2 class="h6 text-uppercase fw-semibold text-body-secondary mb-0">Map Properties</h2>
                  <span data-basemap-help-mount></span>
                </div>
                <span data-base-map-toggle-mount></span>
              </div>
              <!-- No empty-state note — "no map loaded" is represented by
                   this section starting collapsed (see setBaseMapCollapsed's
                   own default in app.js) rather than a placeholder line of
                   text; loading a real map expands it (applyMapSnapshot's
                   own setPanelFocus(false) call). -->
              <div class="d-flex flex-column gap-3" data-base-map-panel>
                <div data-field-mount="map-name"></div>
                <div data-field-mount="base-map-type"></div>

                <div class="d-flex flex-column gap-2" data-base-map-settings="tile">
                  <div data-field-mount="base-map-tile-provider"></div>
                  <div data-field-mount="base-map-tile-quick-pick"></div>
                </div>

                <div class="d-flex flex-column gap-2" data-base-map-settings="image">
                  <div data-field-mount="base-map-image-src"></div>
                  <div data-field-mount="base-map-image-size"></div>
                </div>

                <div class="d-flex flex-column gap-2" data-base-map-settings="canvas">
                  <div data-field-mount="base-map-canvas-background"></div>
                </div>

                <div data-field-mount="map-measurement"></div>
                <div data-field-mount="map-initial-view"></div>
              </div>
            </section>

            <section class="d-flex flex-column gap-3">
              <div class="d-flex align-items-center justify-content-between">
                <div class="d-flex align-items-center gap-2">
                  <h2 class="h6 text-uppercase fw-semibold text-body-secondary mb-0">Selection</h2>
                  <span data-selection-help-mount></span>
                </div>
                <div class="d-flex align-items-center gap-2">
                  <span data-selection-clear-mount></span>
                  <span data-selection-toggle-mount></span>
                </div>
              </div>
              <div class="d-flex flex-column gap-3" data-selection-panel id="orrery-selection">
                <div class="btn-toolbar justify-content-center" role="toolbar" aria-label="Selection actions" data-selection-toolbar-mount></div>
                <div class="pane-card">
                  <div class="d-flex align-items-start gap-2 mb-2">
                    <span class="iconify fs-4 text-primary flex-shrink-0 d-none" data-selection-type-icon aria-hidden="true"></span>
                    <div class="h6 mb-0" data-selection-title>No selection</div>
                  </div>
                  <div class="small text-body-secondary" data-selection-details>
                    Select a layer, group, view, or grid cell to inspect it.
                  </div>
                </div>
                <div class="d-flex flex-column gap-3" data-selection-editor></div>
              </div>
            </section>
        </div>
      </div>
    </div>

    <div class="status-root" data-status-root></div>

    <!-- Ported from Press's own #press-pattern-modal (press/index.html) —
         same structure (category tabs, thumbnail grid, live preview +
         dynamically-built controls), reading from shape-effect-library.js's
         own SHAPE_EFFECT_PRESETS registry instead of pattern-library.js's.
         Opened from the selection inspector's own "Change Shape/Effect"
         button (app.js's initShapeEffectModal) — never from the toolbar's
         own pre-placement type select, which stays a plain dropdown. -->
    <div class="modal fade" id="orrery-shape-effect-modal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
          <div class="modal-header">
            <h2 class="modal-title fs-5">Change Shape/Effect</h2>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body d-flex flex-column gap-3">
            <div class="btn-group" role="group" aria-label="Category" data-shape-effect-category-group>
              <input type="radio" class="btn-check" name="shape-effect-category" id="shape-effect-category-shapes" value="shapes" autocomplete="off" checked />
              <label class="btn btn-outline-secondary btn-sm" for="shape-effect-category-shapes">Shapes</label>
              <input type="radio" class="btn-check" name="shape-effect-category" id="shape-effect-category-effects" value="effects" autocomplete="off" />
              <label class="btn btn-outline-secondary btn-sm" for="shape-effect-category-effects">Effects</label>
              <input type="radio" class="btn-check" name="shape-effect-category" id="shape-effect-category-weather" value="weather" autocomplete="off" />
              <label class="btn btn-outline-secondary btn-sm" for="shape-effect-category-weather">Weather</label>
            </div>
            <div class="row g-3">
              <div class="col-12 col-md-7">
                <div class="d-flex flex-wrap gap-2" data-shape-effect-thumbnails></div>
              </div>
              <div class="col-12 col-md-5 d-flex flex-column gap-3 border-start-md ps-md-3">
                <div class="d-flex flex-column align-items-center gap-2 border rounded-3 bg-body-tertiary p-3">
                  <div data-shape-effect-preview style="width: 100px; height: 100px"></div>
                  <div class="fw-semibold small text-body-secondary" data-shape-effect-preview-label>Select a shape or effect</div>
                </div>
                <div class="d-flex flex-column gap-2" data-shape-effect-controls></div>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="button" class="btn btn-primary" data-shape-effect-apply disabled>Apply</button>
          </div>
        </div>
      </div>
    </div>

    <div class="modal fade" id="orrery-move-marker-modal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h2 class="modal-title fs-5" data-move-marker-title>Move Marker</h2>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body d-flex flex-column gap-3">
            <div class="form-floating">
              <select class="form-select" id="orrery-move-marker-map-select" data-move-marker-map-select>
                <option value="" disabled selected>Select a map</option>
              </select>
              <label for="orrery-move-marker-map-select">Destination Map</label>
            </div>
            <div class="form-floating d-none" data-move-marker-layer-field>
              <select class="form-select" id="orrery-move-marker-layer-select" data-move-marker-layer-select></select>
              <label for="orrery-move-marker-layer-select">Destination Marker Layer</label>
            </div>
            <div class="small text-body-secondary d-none" data-move-marker-new-layer-note>
              This map has no Marker Layer yet — one will be created.
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="button" class="btn btn-primary" data-move-marker-apply disabled>Move</button>
          </div>
        </div>
      </div>
    </div>

    <!-- NOT reordered before these scripts, unlike every other tool page —
         js/app.js calls baseMapManager.setBaseMap(...) synchronously at
         module top level (not inside a deferred/lazy call), which for a
         tile base map needs window.L (Leaflet) to already exist or it
         falls back to a visible "Leaflet failed to load" placeholder with
         no retry once Leaflet actually finishes loading. See
         undercroft/index.html for why other pages ARE reordered. -->
    <script defer src="https://cdn.jsdelivr.net/npm/@iconify/iconify@3.1.1/dist/iconify.min.js"></script>
    <!-- Not previously loaded here at all — the "Show" anchor picker in the
         marker Journal Page Reference editor (js/app.js's own
         updateAnchorSelect) calls repository/js/lib/journal-quests.js's own
         extractQuests, which requires window.marked.lexer and silently
         returns [] (no error, no quests, ever) without it — confirmed real
         bug, not a content-authoring issue. Only marked itself is needed
         here (extractQuests only lexes, it never calls marked.parse or
         DOMPurify.sanitize), unlike Repository/Handout's own full markdown
         rendering. -->
    <script defer src="https://cdn.jsdelivr.net/npm/marked@18.0.7/lib/marked.umd.min.js"></script>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script
      defer
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
