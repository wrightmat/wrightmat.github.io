<!DOCTYPE html>
<html lang="en" data-theme="system">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Undercroft Orrery</title>
    <script src="../common/js/theme-init.js"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="../common/css/shell.css" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="bg-body text-body" data-undercroft-tool="orrery">
    <div id="orrery-map" class="orrery-map" role="img" aria-label="Orrery map viewport"></div>

    <div class="d-flex flex-column min-vh-100 workbench-app orrery-shell">
      <div data-app-shell-header></div>

      <div class="d-flex flex-grow-1 workbench-shell">
        <div data-pane-content="left">
            <section class="d-flex flex-column gap-3">
              <div class="btn-toolbar justify-content-center" role="toolbar" aria-label="Orrery actions">
                <div class="btn-group" role="group" data-map-toolbar-mount></div>
              </div>
            </section>

            <section class="d-flex flex-column gap-2">
              <div data-field-mount="map-select"></div>
              <input
                class="form-control form-control-sm"
                id="orreryMapName"
                data-map-name
                placeholder="Map name"
              />
            </section>

            <section class="d-flex flex-column gap-3">
              <div class="d-flex align-items-center justify-content-between">
                <div class="d-flex align-items-center gap-2">
                  <h2 class="h6 text-uppercase fw-semibold text-body-secondary mb-0">Layers</h2>
                  <span data-layers-help-mount></span>
                </div>
                <div class="btn-toolbar" role="toolbar" aria-label="Add layers">
                  <div class="btn-group btn-group-sm" role="group" data-add-layer-mount></div>
                </div>
              </div>
              <div class="list-group orrery-pane-list" data-layer-list></div>
            </section>

            <section class="d-flex flex-column gap-3">
              <div class="d-flex align-items-center justify-content-between">
                <div class="d-flex align-items-center gap-2">
                  <h2 class="h6 text-uppercase fw-semibold text-body-secondary mb-0">Groups</h2>
                  <span data-groups-help-mount></span>
                </div>
                <div class="btn-toolbar" role="toolbar" aria-label="Add group">
                  <div class="btn-group btn-group-sm" role="group" data-add-group-mount></div>
                </div>
              </div>
              <div class="list-group orrery-pane-list" data-group-list></div>
            </section>

            <section class="d-flex flex-column gap-3">
              <div class="d-flex align-items-center justify-content-between">
                <div class="d-flex align-items-center gap-2">
                  <h2 class="h6 text-uppercase fw-semibold text-body-secondary mb-0">Views</h2>
                  <span data-help-topic="orrery.views" data-help-insert="replace"></span>
                </div>
                <div class="btn-toolbar" role="toolbar" aria-label="Add view">
                  <div class="btn-group btn-group-sm" role="group" data-add-view-mount></div>
                </div>
              </div>
              <div class="list-group orrery-pane-list" data-view-list></div>
            </section>

            <div class="mt-auto" id="orrery-json" data-json-mount></div>
        </div>

        <main class="flex-grow-1 position-relative workbench-main" data-map-main>
          <div class="orrery-floating-panel shadow-theme" data-view-panel>
            <div class="d-flex align-items-center gap-2 orrery-view-handle" data-view-handle>
              <div class="btn-group btn-group-sm" role="group" aria-label="Map zoom controls">
                <button class="btn btn-outline-secondary" type="button" data-zoom-out>
                  <span class="iconify" data-icon="tabler:zoom-out" aria-hidden="true"></span>
                  <span class="visually-hidden">Zoom out</span>
                </button>
                <button class="btn btn-outline-secondary" type="button" data-zoom-reset>Reset</button>
                <button class="btn btn-outline-secondary" type="button" data-zoom-in>
                  <span class="iconify" data-icon="tabler:zoom-in" aria-hidden="true"></span>
                  <span class="visually-hidden">Zoom in</span>
                </button>
              </div>
              <button class="btn btn-outline-secondary btn-sm" type="button" data-view-toggle aria-expanded="false">
                <span class="iconify" data-icon="tabler:chevron-left" aria-hidden="true"></span>
                <span class="visually-hidden">Expand view details</span>
              </button>
            </div>
            <div class="orrery-view-details mt-2 d-none" data-view-details>
              <dl class="mb-0 small">
                <div class="d-flex justify-content-between">
                  <dt>Mode</dt>
                  <dd class="mb-0" data-view-mode></dd>
                </div>
                <div class="d-flex justify-content-between">
                  <dt>Zoom</dt>
                  <dd class="mb-0" data-view-zoom></dd>
                </div>
                <div class="d-flex justify-content-between">
                  <dt>Center</dt>
                  <dd class="mb-0" data-view-center></dd>
                </div>
                <div class="d-flex justify-content-between">
                  <dt>Pan</dt>
                  <dd class="mb-0" data-view-pan></dd>
                </div>
              </dl>
            </div>
          </div>
        </main>

        <div data-pane-content="right">
            <section class="d-flex flex-column gap-3">
              <div class="d-flex align-items-center justify-content-between">
                <div class="d-flex align-items-center gap-2">
                  <h2 class="h6 text-uppercase fw-semibold text-body-secondary mb-0">Base Map</h2>
                  <span data-basemap-help-mount></span>
                </div>
                <span data-base-map-toggle-mount></span>
              </div>
              <div class="d-flex flex-column gap-3" data-base-map-panel>
                <div data-field-mount="base-map-type"></div>

                <div class="d-flex flex-column gap-2" data-base-map-settings="tile">
                  <label class="form-label mb-0" for="base-map-tile-provider">Tile Provider</label>
                  <input
                    class="form-control form-control-sm orrery-provider-input"
                    type="text"
                    id="base-map-tile-provider"
                    value="https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png"
                  />
                  <label class="form-label mb-0" for="base-map-tile-quick-pick">Quick picks</label>
                  <select class="form-select form-select-sm" id="base-map-tile-quick-pick" data-base-map-tile-quick-pick>
                    <option value="">Select a tile provider</option>
                    <option
                      value="forgotten-realms"
                      data-tile-url="https://loremaps.github.io/LoreMaps-Faerun-Tiles/Tiles/{z}/{x}/{y}.png"
                      data-tile-max-zoom="6"
                      data-tile-initial-zoom="3"
                    >
                      Forgotten Realms
                    </option>
                    <option
                      value="eberron"
                      data-tile-url="https://eberronmap.johnarcadian.com/worldbin/eberron/{z}/{x}/{y}.jpg"
                      data-tile-max-zoom="7"
                      data-tile-initial-zoom="2.75"
                    >
                      Eberron
                    </option>
                    <option
                      value="sharn"
                      data-tile-url="https://eberronmap.johnarcadian.com/worldbin/sharncityoftowers/{z}/{x}/{y}.jpg"
                      data-tile-max-zoom="6"
                      data-tile-initial-zoom="2"
                    >
                      Sharn: City of Towers
                    </option>
                    <option
                      value="real-world"
                      data-tile-url="https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png"
                      data-tile-max-zoom="19"
                      data-tile-initial-zoom="2"
                    >
                      Real World
                    </option>
                  </select>
                </div>

                <div class="d-flex flex-column gap-2" data-base-map-settings="image">
                  <div data-field-mount="base-map-image-src"></div>
                  <div class="d-flex gap-2">
                    <input
                      class="form-control"
                      type="number"
                      min="200"
                      step="50"
                      id="base-map-image-width"
                      data-base-map-image-width
                      placeholder="Width"
                    />
                    <input
                      class="form-control"
                      type="number"
                      min="200"
                      step="50"
                      id="base-map-image-height"
                      data-base-map-image-height
                      placeholder="Height"
                    />
                  </div>
                </div>

                <div class="d-flex flex-column gap-2" data-base-map-settings="canvas">
                  <label class="form-label mb-0" for="base-map-canvas-background">Canvas Background</label>
                  <input
                    class="form-control form-control-color"
                    type="color"
                    id="base-map-canvas-background"
                    data-base-map-canvas-background
                  />
                </div>
              </div>
            </section>

            <section class="d-flex flex-column gap-3">
              <div class="d-flex align-items-center justify-content-between">
                <div class="d-flex align-items-center gap-2">
                  <h2 class="h6 text-uppercase fw-semibold text-body-secondary mb-0">Selection</h2>
                  <span data-selection-help-mount></span>
                </div>
                <div class="d-flex align-items-center gap-2">
                  <span data-selection-clear-mount></span>
                  <span data-selection-toggle-mount></span>
                </div>
              </div>
              <div class="d-flex flex-column gap-3" data-selection-panel id="orrery-selection">
                <div class="pane-card">
                  <div class="d-flex justify-content-between align-items-start mb-2">
                    <div>
                      <div class="h6 mb-0" data-selection-title>No selection</div>
                    </div>
                    <span class="badge text-bg-secondary text-uppercase" data-selection-type>None</span>
                  </div>
                  <div class="small text-body-secondary" data-selection-details>
                    Select a layer, group, view, or grid cell to inspect it.
                  </div>
                </div>
                <div class="d-flex flex-column gap-3" data-selection-editor></div>
              </div>
            </section>
        </div>
      </div>
    </div>

    <div class="status-root" data-status-root></div>

    <!-- NOT reordered before these scripts, unlike every other tool page —
         js/app.js calls baseMapManager.setBaseMap(...) synchronously at
         module top level (not inside a deferred/lazy call), which for a
         tile base map needs window.L (Leaflet) to already exist or it
         falls back to a visible "Leaflet failed to load" placeholder with
         no retry once Leaflet actually finishes loading. See
         undercroft/index.html for why other pages ARE reordered. -->
    <script defer src="https://cdn.jsdelivr.net/npm/@iconify/iconify@3.1.1/dist/iconify.min.js"></script>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script
      defer
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
