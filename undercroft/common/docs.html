<!DOCTYPE html>
<html lang="en" data-theme="system">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Undercroft Documentation</title>
    <script src="js/theme-init.js"></script>
    <link rel="stylesheet" href="css/shell.css" />
  </head>
  <body class="bg-body text-body" data-undercroft-tool="docs">
    <div class="d-flex flex-column min-vh-100 workbench-app">
      <div data-app-shell-header></div>
      <div class="d-flex flex-grow-1 overflow-hidden">
        <div data-pane-content="left">
          <div class="d-flex flex-column gap-3" style="min-height: 0;">
            <div class="d-flex flex-column gap-1 flex-shrink-0">
              <h2 class="text-uppercase fs-6 fw-semibold text-body-secondary mb-0">Documentation Topics</h2>
              <p class="text-body-secondary small mb-0" data-docs-description></p>
              <div class="d-flex align-items-center gap-2 flex-wrap" data-docs-metadata></div>
            </div>
            <input
              class="form-control form-control-sm flex-shrink-0"
              type="search"
              placeholder="Search topics…"
              aria-label="Search documentation topics"
              data-docs-search
            />
            <nav class="d-flex flex-column gap-1 overflow-auto flex-grow-1 position-relative pane-scroll" style="min-height: 0;" aria-label="Documentation navigation" data-docs-toc>
              <p class="text-body-secondary small mb-0">Loading topics…</p>
            </nav>
          </div>
        </div>
        <main class="workbench-main flex-grow-1 p-4 overflow-auto position-relative">
          <div class="d-flex flex-column gap-4" data-docs-root>
            <p class="text-body-secondary mb-0">Topics will appear here once the help catalog loads.</p>
          </div>
        </main>
      </div>
    </div>
    <div class="status-root" data-status-root></div>
    <!-- Module script placed before the deferred CDN scripts on purpose —
         both execute in shared document order after parsing, so this
         ordering keeps the page's own JS from waiting on the CDN scripts
         to finish loading before it can run. See undercroft/index.html for
         the full explanation. -->
    <script defer src="https://cdn.jsdelivr.net/npm/@iconify/iconify@3.1.1/dist/iconify.min.js" integrity="sha384-Ok2uDHnWhbSMsjjXrs20mYHBe3BLztRYQuPMBhyLnjPNH7OqWdv/c8Bmv54yhfKR" crossorigin="anonymous"></script>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script type="module" src="docs.js"></script>
  </body>
</html>
